<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Éxito con Javi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8 font-sans text-gray-800">

    <!-- SECCIÓN DE LOGIN -->
    <div id="login-section" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-200 mt-20">
        <h2 class="text-2xl font-bold text-center mb-6">Acceso Administrador</h2>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Email</label>
                <input type="email" id="login-email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black outline-none" autocomplete="username">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Contraseña</label>
                <input type="password" id="login-password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black outline-none" autocomplete="current-password">
            </div>
            <button type="submit" id="login-btn" class="w-full bg-black text-white font-bold py-3 rounded-lg hover:bg-gray-800 transition">Entrar</button>
            <div id="login-error" class="bg-red-50 border-l-4 border-red-500 p-4 mt-4 hidden">
                <p class="text-red-700 text-sm font-semibold" id="login-error-text"></p>
            </div>
        </form>
    </div>

    <!-- SECCIÓN DE ADMINISTRADOR -->
    <div id="admin-section" class="hidden max-w-5xl mx-auto">
        
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <div class="flex gap-4">
                <button onclick="switchTab('add')" id="btn-tab-add" class="font-bold text-black border-b-2 border-black pb-1 focus:outline-none">Añadir/Editar Producto</button>
                <button onclick="switchTab('catalog')" id="btn-tab-catalog" class="font-bold text-gray-400 hover:text-black pb-1 focus:outline-none">Catálogo</button>
                <button onclick="switchTab('orders')" id="btn-tab-orders" class="font-bold text-gray-400 hover:text-black pb-1 focus:outline-none">Pedidos</button>
            </div>
            <button onclick="logout()" class="text-sm text-red-600 hover:underline font-semibold focus:outline-none">Cerrar Sesión</button>
        </div>

        <!-- PESTAÑA: AÑADIR / EDITAR PRODUCTO -->
        <div id="tab-add" class="bg-white p-8 rounded-xl shadow-md border border-gray-200">
            <h1 class="text-2xl font-bold text-gray-900 mb-6" id="form-title">Añadir Nuevo Producto</h1>
            <form id="product-form" class="space-y-6">
                <!-- Campo oculto para saber si estamos editando o creando -->
                <input type="hidden" id="product-id">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="col-span-1 md:col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre del producto *</label>
                        <input type="text" id="name" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Precio (€) *</label>
                        <input type="number" id="price" step="0.01" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Descripción</label>
                    <textarea id="description" rows="3" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black outline-none"></textarea>
                </div>
                <div id="variants-container" class="space-y-4"></div>
                <button type="submit" id="submit-btn" class="w-full bg-black text-white font-bold py-3 rounded-lg hover:bg-gray-800 transition">Guardar Producto</button>
            </form>
        </div>

        <!-- PESTAÑA: CATÁLOGO -->
        <div id="tab-catalog" class="hidden bg-white p-8 rounded-xl shadow-md border border-gray-200">
            <table class="w-full text-left">
                <tbody id="catalog-body"></tbody>
            </table>
        </div>

        <!-- PESTAÑA: PEDIDOS -->
        <div id="tab-orders" class="hidden bg-white p-8 rounded-xl shadow-md border border-gray-200">
            <h2 class="text-2xl font-bold mb-4">Pedidos</h2>
            <div id="orders-container"></div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN SUPABASE
        var supabaseUrl = 'https://koignwzdqxcilwieqijq.supabase.co'; 
        var supabaseAnonKey = 'sb_publishable__bw11mniMfgl_R9JWyL7SA_aPKqltNa';
        var supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        // LÓGICA DE LOGIN
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            const errorText = document.getElementById('login-error-text');
            
            btn.innerText = 'Entrando...';
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                errorText.innerText = "Error: " + error.message;
                document.getElementById('login-error').classList.remove('hidden');
                btn.innerText = 'Entrar';
                btn.disabled = false;
            } else {
                location.reload(); 
            }
        });

        // LÓGICA DE CERRAR SESIÓN
        async function logout() { 
            await supabase.auth.signOut(); 
            location.reload(); 
        }

        // CARGAR SESIÓN INICIAL
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
            }
        });

        // --- LÓGICA DE PESTAÑAS (TABS) ---
        function switchTab(tabId) {
            document.getElementById('tab-add').classList.add('hidden');
            document.getElementById('tab-catalog').classList.add('hidden');
            document.getElementById('tab-orders').classList.add('hidden');

            const btnAdd = document.getElementById('btn-tab-add');
            const btnCatalog = document.getElementById('btn-tab-catalog');
            const btnOrders = document.getElementById('btn-tab-orders');

            [btnAdd, btnCatalog, btnOrders].forEach(btn => {
                btn.className = 'font-bold text-gray-400 hover:text-black pb-1 focus:outline-none'; 
            });

            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`btn-tab-${tabId}`).className = 'font-bold text-black border-b-2 border-black pb-1 focus:outline-none'; 

            // Si cambiamos a 'add' manualmente, limpiamos el formulario por si acaso estaba en modo "Editar"
            if (tabId === 'add') {
                if(!document.getElementById('product-id').value) resetProductForm();
            } else if (tabId === 'catalog') {
                loadCatalog();
            } else if (tabId === 'orders') {
                loadOrders();
            }
        }

        // --- GESTIÓN DE PRODUCTOS (GUARDAR / EDITAR / ELIMINAR) ---
        
        // Limpiar el formulario
        function resetProductForm() {
            document.getElementById('product-form').reset();
            document.getElementById('product-id').value = '';
            document.getElementById('form-title').innerText = 'Añadir Nuevo Producto';
        }

        // Guardar o Actualizar Producto
        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('product-id').value;
            const name = document.getElementById('name').value;
            const price = parseFloat(document.getElementById('price').value);
            const description = document.getElementById('description').value;
            const btn = document.getElementById('submit-btn');
            
            btn.innerText = 'Guardando...';
            btn.disabled = true;

            // Preparamos los datos para la BD (Asegúrate de que los nombres coincidan con tus columnas)
            const productData = { 
                name: name, 
                price: price, 
                description: description 
            };

            let errorResult;

            if (id) {
                // Si hay ID, estamos actualizando
                const { error } = await supabase.from('products').update(productData).eq('id', id);
                errorResult = error;
            } else {
                // Si no hay ID, creamos uno nuevo
                const { error } = await supabase.from('products').insert([productData]);
                errorResult = error;
            }

            if (errorResult) {
                alert('Error al guardar: ' + errorResult.message);
            } else {
                alert(id ? 'Producto actualizado correctamente' : 'Producto añadido correctamente');
                resetProductForm();
                switchTab('catalog'); // Te lleva al catálogo para que veas los cambios
            }

            btn.innerText = 'Guardar Producto';
            btn.disabled = false;
        });

        // Cargar datos en el formulario para editar
        async function editProduct(id) {
            const { data, error } = await supabase.from('products').select('*').eq('id', id).single();
            if (error) {
                alert("Error al cargar producto: " + error.message);
                return;
            }
            
            // Rellenar formulario
            document.getElementById('product-id').value = data.id;
            document.getElementById('name').value = data.name || data.nombre || '';
            document.getElementById('price').value = data.price || data.precio || '';
            document.getElementById('description').value = data.description || data.descripcion || '';
            
            // Cambiar título y de pestaña
            document.getElementById('form-title').innerText = 'Editar Producto';
            switchTab('add');
        }

        // Eliminar producto
        async function deleteProduct(id) {
            if (confirm('¿Estás seguro de que quieres eliminar este producto?')) {
                const { error } = await supabase.from('products').delete().eq('id', id);
                if (error) {
                    alert('Error al eliminar: ' + error.message);
                } else {
                    loadCatalog(); // Recargar la tabla
                }
            }
        }


        // --- CARGAR CATÁLOGO ---
        async function loadCatalog() {
            const tbody = document.getElementById('catalog-body');
            tbody.innerHTML = '<tr><td class="p-4 text-gray-500">Cargando productos...</td></tr>';

            const { data, error } = await supabase.from('products').select('*');

            if (error) {
                tbody.innerHTML = `<tr><td class="p-4 text-red-500">Error al cargar: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td class="p-4 text-gray-500">No hay productos en el catálogo.</td></tr>';
                return;
            }

            let html = `
                <tr class="bg-gray-50 border-b">
                    <th class="p-4 font-semibold text-gray-700">Nombre</th>
                    <th class="p-4 font-semibold text-gray-700">Precio</th>
                    <th class="p-4 font-semibold text-gray-700">Acciones</th>
                </tr>
            `;

            data.forEach(product => {
                html += `
                    <tr class="border-b hover:bg-gray-50 transition">
                        <td class="p-4">${product.name || product.nombre || 'Sin nombre'}</td>
                        <td class="p-4 font-medium">${product.price || product.precio || '0.00'} €</td>
                        <td class="p-4">
                            <button onclick="editProduct('${product.id}')" class="text-blue-600 hover:underline mr-4 font-semibold">Editar</button>
                            <button onclick="deleteProduct('${product.id}')" class="text-red-600 hover:underline font-semibold">Eliminar</button>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        // --- CARGAR PEDIDOS ---
        async function loadOrders() {
            const container = document.getElementById('orders-container');
            container.innerHTML = '<p class="text-gray-500">Cargando pedidos...</p>';

            const { data, error } = await supabase.from('orders').select('*').order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<p class="text-red-500">Error al cargar: ${error.message}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = '<p class="text-gray-500">Aún no hay pedidos registrados.</p>';
                return;
            }

            let html = `
                <table class="w-full text-left border-collapse mt-4">
                    <thead>
                        <tr class="bg-gray-50 border-b">
                            <th class="p-4 font-semibold text-gray-700">ID / Fecha</th>
                            <th class="p-4 font-semibold text-gray-700">Info Cliente</th>
                            <th class="p-4 font-semibold text-gray-700">Total</th>
                            <th class="p-4 font-semibold text-gray-700">Estado</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach(order => {
                const date = new Date(order.created_at).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                const statusStr = order.status || order.estado || '';
                
                // Generar el badge y botón de estado
                let statusHtml = '';
                if (statusStr.toLowerCase() === 'completado') {
                    statusHtml = `<span class="bg-green-100 text-green-800 text-xs font-bold px-3 py-1 rounded-full">Completado</span>`;
                } else {
                    statusHtml = `
                        <span class="bg-yellow-100 text-yellow-800 text-xs font-bold px-3 py-1 rounded-full mb-2 inline-block">Pendiente</span>
                        <button onclick="markOrderCompleted('${order.id}')" class="block text-xs bg-black text-white px-3 py-1.5 rounded hover:bg-gray-800 transition shadow-sm font-semibold">Marcar Completado</button>
                    `;
                }

                html += `
                    <tr class="border-b hover:bg-gray-50 transition">
                        <td class="p-4">
                            <span class="text-sm font-bold block">#${order.id}</span>
                            <span class="text-xs text-gray-500 block mt-1">${date}</span>
                        </td>
                        <td class="p-4">
                            <div class="font-bold text-gray-900">${order.customer_name || order.cliente || 'Desconocido'}</div>
                            <div class="text-sm text-gray-600 mt-1">📧 ${order.email || order.correo || 'Sin correo'}</div>
                            <div class="text-sm text-gray-600 mt-0.5">📞 ${order.phone || order.telefono || 'Sin teléfono'}</div>
                        </td>
                        <td class="p-4 font-bold text-lg">${order.total_price || order.total || order.precio_total || '0.00'} €</td>
                        <td class="p-4">${statusHtml}</td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // Marcar un pedido como completado en la BD
        async function markOrderCompleted(id) {
            if (confirm('¿Marcar este pedido como Completado?')) {
                // He puesto 'status' ya que la tabla se llama orders, si la columna se llama 'estado' cambialo aquí.
                const { error } = await supabase.from('orders').update({ status: 'Completado' }).eq('id', id);
                if (error) {
                    alert('Error al actualizar el pedido: ' + error.message);
                } else {
                    loadOrders(); // Recarga la vista de pedidos para ver el botón verde
                }
            }
        }

        // --- FUNCIONES MANTENIDAS (Para que el resto no de fallos al integrarlo a futuro) ---
        function addVariantRow() { console.log('Añadir variante'); }
        function openCloudinaryWidget(id) { console.log('Abrir Cloudinary', id); }

    </script>
</body>
</html>
