<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Éxito con Javi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8 font-sans text-gray-800">

    <!-- SECCIÓN DE LOGIN -->
    <div id="login-section" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-200 mt-20">
        <h2 class="text-2xl font-bold text-center mb-6">Acceso Administrador</h2>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Email</label>
                <input type="email" id="login-email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black outline-none" autocomplete="username">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Contraseña</label>
                <input type="password" id="login-password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black outline-none" autocomplete="current-password">
            </div>
            <button type="submit" id="login-btn" class="w-full bg-black text-white font-bold py-3 rounded-lg hover:bg-gray-800 transition">Entrar</button>
            <div id="login-error" class="bg-red-50 border-l-4 border-red-500 p-4 mt-4 hidden">
                <p class="text-red-700 text-sm font-semibold" id="login-error-text"></p>
            </div>
        </form>
    </div>

    <!-- SECCIÓN DE ADMINISTRADOR -->
    <div id="admin-section" class="hidden max-w-6xl mx-auto">
        
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <div class="flex gap-4">
                <button onclick="switchTab('add')" id="btn-tab-add" class="font-bold text-black border-b-2 border-black pb-1 focus:outline-none transition">Añadir/Editar Producto</button>
                <button onclick="switchTab('catalog')" id="btn-tab-catalog" class="font-bold text-gray-400 hover:text-black pb-1 focus:outline-none transition">Catálogo (Tiempo Real)</button>
                <button onclick="switchTab('orders')" id="btn-tab-orders" class="font-bold text-gray-400 hover:text-black pb-1 focus:outline-none transition">Pedidos</button>
            </div>
            <div class="flex items-center gap-4">
                <span id="realtime-status" class="flex items-center gap-2 text-xs font-bold text-green-600 bg-green-100 px-3 py-1.5 rounded-full shadow-sm">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> En línea
                </span>
                <button onclick="logout()" class="text-sm text-red-600 hover:underline font-semibold focus:outline-none">Cerrar Sesión</button>
            </div>
        </div>

        <!-- PESTAÑA: AÑADIR / EDITAR PRODUCTO -->
        <div id="tab-add" class="bg-white p-8 rounded-xl shadow-md border border-gray-200">
            <h1 class="text-2xl font-bold text-gray-900 mb-6" id="form-title">Añadir Nuevo Producto</h1>
            <form id="product-form" class="space-y-6">
                <input type="hidden" id="product-id">

                <!-- Info Principal -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-gray-50 p-6 rounded-lg border">
                    <div class="col-span-1 md:col-span-2">
                        <h3 class="font-bold text-lg mb-4">Información Principal</h3>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre del producto *</label>
                        <input type="text" id="name" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black outline-none mb-4">
                        
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Precio Base (€) *</label>
                        <input type="number" id="price" step="0.01" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black outline-none mb-4">
                        
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Descripción</label>
                        <textarea id="description" rows="3" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black outline-none mb-4"></textarea>

                        <label class="flex items-center gap-2 cursor-pointer mt-2 w-max">
                            <input type="checkbox" id="is-visible" class="w-5 h-5 rounded cursor-pointer" checked>
                            <span class="text-sm font-semibold text-gray-700">Producto Visible en la tienda</span>
                        </label>
                    </div>
                </div>

                <!-- Variantes / Colores -->
                <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-lg">Colores y Fotos</h3>
                        <button type="button" onclick="addVariantRow()" class="bg-black text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-gray-800 transition">+ Añadir Color</button>
                    </div>
                    <div id="variants-container" class="space-y-4">
                        <!-- Las variantes se inyectarán aquí -->
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-black text-white font-bold py-4 rounded-xl text-lg hover:bg-gray-800 transition shadow-lg flex justify-center items-center gap-2">
                    Guardar Producto Completo
                </button>
            </form>
        </div>

        <!-- PESTAÑA: CATÁLOGO -->
        <div id="tab-catalog" class="hidden bg-white p-8 rounded-xl shadow-md border border-gray-200">
            <p class="text-sm text-gray-500 mb-4 font-medium">💡 Clic en los botones de colores para marcarlos como agotados o disponibles instantáneamente.</p>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <tbody id="catalog-body"></tbody>
                </table>
            </div>
        </div>

        <!-- PESTAÑA: PEDIDOS -->
        <div id="tab-orders" class="hidden bg-white p-8 rounded-xl shadow-md border border-gray-200">
            <h2 class="text-2xl font-bold mb-4">Pedidos</h2>
            <div id="orders-container"></div>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN SUPABASE ---
        var supabaseUrl = 'https://koignwzdqxcilwieqijq.supabase.co'; 
        var supabaseAnonKey = 'sb_publishable__bw11mniMfgl_R9JWyL7SA_aPKqltNa';
        var supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        // --- CONFIGURACIÓN CLOUDINARY ---
        const CLOUDINARY_CLOUD_NAME = 'dkg1ytbxb'; 
        const CLOUDINARY_UPLOAD_PRESET = 'tienda_ropa';  

        let deletedVariants = []; 

        // LOGIN Y SESIÓN
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            
            btn.innerText = 'Entrando...';
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                document.getElementById('login-error-text').innerText = "Error: " + error.message;
                document.getElementById('login-error').classList.remove('hidden');
                btn.innerText = 'Entrar';
            } else {
                location.reload(); 
            }
        });

        async function logout() { await supabase.auth.signOut(); location.reload(); }

        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
                loadCatalog(); 
                setupRealtime();
            }
        });

        // --- SISTEMA REALTIME ---
        function setupRealtime() {
            supabase
                .channel('schema-db-changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, payload => {
                    if (!document.getElementById('tab-orders').classList.contains('hidden')) loadOrders();
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, payload => {
                    if (!document.getElementById('tab-catalog').classList.contains('hidden')) loadCatalog();
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'product_variants' }, payload => {
                    if (!document.getElementById('tab-catalog').classList.contains('hidden')) loadCatalog();
                })
                .subscribe((status) => {
                    const statusIndicator = document.getElementById('realtime-status');
                    if (status === 'SUBSCRIBED') {
                        statusIndicator.innerHTML = `<span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> En línea`;
                        statusIndicator.className = 'flex items-center gap-2 text-xs font-bold text-green-600 bg-green-100 px-3 py-1.5 rounded-full shadow-sm transition';
                    } else {
                        statusIndicator.innerHTML = `<span class="w-2 h-2 bg-red-500 rounded-full"></span> Desconectado`;
                        statusIndicator.className = 'flex items-center gap-2 text-xs font-bold text-red-600 bg-red-100 px-3 py-1.5 rounded-full shadow-sm transition';
                    }
                });
        }

        // --- PESTAÑAS ---
        function switchTab(tabId) {
            document.getElementById('tab-add').classList.add('hidden');
            document.getElementById('tab-catalog').classList.add('hidden');
            document.getElementById('tab-orders').classList.add('hidden');

            ['add', 'catalog', 'orders'].forEach(id => {
                document.getElementById(`btn-tab-${id}`).className = 'font-bold text-gray-400 hover:text-black pb-1 focus:outline-none transition'; 
            });

            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`btn-tab-${tabId}`).className = 'font-bold text-black border-b-2 border-black pb-1 focus:outline-none transition'; 

            if (tabId === 'add' && !document.getElementById('product-id').value) resetProductForm();
            if (tabId === 'catalog') loadCatalog();
            if (tabId === 'orders') loadOrders();
        }

        // --- FUNCIONES DE IMÁGENES (CLOUDINARY) ---
        function openCloudinaryWidget(targetInputId, isMultiple = true) {
            cloudinary.openUploadWidget({
                cloudName: CLOUDINARY_CLOUD_NAME,
                uploadPreset: CLOUDINARY_UPLOAD_PRESET,
                multiple: isMultiple
            }, (error, result) => {
                if (!error && result && result.event === "success") {
                    const input = document.getElementById(targetInputId);
                    if (isMultiple) {
                        let currentUrls = input.value ? input.value.split(',') : [];
                        currentUrls.push(result.info.secure_url);
                        input.value = currentUrls.join(',');
                    } else {
                        input.value = result.info.secure_url;
                    }
                    renderImagePreviews(targetInputId);
                }
            });
        }

        function renderImagePreviews(inputId) {
            const input = document.getElementById(inputId);
            const container = document.getElementById(`preview-${inputId}`);
            container.innerHTML = '';
            
            if (!input.value) return;
            
            const urls = input.value.split(',');
            urls.forEach((url, index) => {
                if(url.trim() === '') return;
                const imgWrap = document.createElement('div');
                imgWrap.className = "relative inline-block border rounded-lg p-1 bg-white shadow-sm";
                imgWrap.innerHTML = `
                    <img src="${url}" class="h-20 w-20 object-cover rounded-md">
                    <button type="button" onclick="removeImage('${inputId}', ${index})" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold hover:bg-red-700 shadow-md transition">&times;</button>
                `;
                container.appendChild(imgWrap);
            });
        }

        window.removeImage = function(inputId, indexToRemove) {
            const input = document.getElementById(inputId);
            let urls = input.value.split(',');
            urls.splice(indexToRemove, 1);
            input.value = urls.join(',');
            renderImagePreviews(inputId);
        };

        // --- GESTIÓN DE VARIANTES ---
        function addVariantRow(variant = null) {
            const container = document.getElementById('variants-container');
            const uniqueId = 'var-' + Date.now() + Math.floor(Math.random() * 1000);
            
            const isSoldOutChecked = variant && variant.is_sold_out ? 'checked' : '';
            const varId = variant ? variant.id : '';
            const varName = variant ? variant.color_name : '';
            const varHex = variant && variant.color_hex ? variant.color_hex : '#000000';
            const varImages = variant && variant.image_url ? variant.image_url : '';

            const div = document.createElement('div');
            div.className = 'variant-row bg-gray-50 p-5 border rounded-xl relative mb-4';
            div.innerHTML = `
                <input type="hidden" class="var-id" value="${varId}">
                <button type="button" onclick="removeVariantRow(this, '${varId}')" class="absolute top-4 right-4 text-red-500 hover:underline text-sm font-bold bg-white px-2 py-1 rounded shadow-sm border border-red-100">🗑 Eliminar Color</button>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4 pr-24">
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-gray-600">Nombre Variante/Color</label>
                        <input type="text" class="var-name w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-black outline-none" placeholder="Ej: Azul Marino" value="${varName}">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-gray-600">Código de Color</label>
                        <input type="color" class="var-hex h-10 w-full rounded cursor-pointer border p-0.5" value="${varHex}">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-xs font-semibold mb-1 text-gray-600">Fotos de este Color (La 1ª será la principal)</label>
                    <input type="hidden" id="input-${uniqueId}" class="var-images" value="${varImages}">
                    <button type="button" onclick="openCloudinaryWidget('input-${uniqueId}', true)" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-300 transition shadow-sm">📷 Subir Fotos</button>
                    <div id="preview-input-${uniqueId}" class="mt-3 flex gap-3 flex-wrap"></div>
                </div>

                <label class="flex items-center gap-2 cursor-pointer mt-2 w-max bg-white px-3 py-1.5 rounded-lg border shadow-sm">
                    <input type="checkbox" class="var-sold-out w-4 h-4 rounded text-red-600" ${isSoldOutChecked}>
                    <span class="text-sm font-semibold ${isSoldOutChecked ? 'text-red-600' : 'text-gray-700'}">Agotado / Ocultar este color</span>
                </label>
            `;
            container.appendChild(div);
            
            if(varImages) renderImagePreviews(`input-${uniqueId}`);
        }

        window.removeVariantRow = function(btn, variantId) {
            if(variantId) deletedVariants.push(parseInt(variantId));
            btn.closest('.variant-row').remove();
        }

        function resetProductForm() {
            document.getElementById('product-form').reset();
            document.getElementById('product-id').value = '';
            document.getElementById('form-title').innerText = 'Añadir Nuevo Producto';
            document.getElementById('is-visible').checked = true;
            document.getElementById('variants-container').innerHTML = '';
            deletedVariants = [];
        }

        // --- GUARDAR PRODUCTO ---
        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            
            // Animación del botón guardando
            btn.innerHTML = '<span class="animate-spin text-xl">⏳</span> Guardando...';
            btn.disabled = true;

            try {
                const idString = document.getElementById('product-id').value;
                const name = document.getElementById('name').value;
                const price = parseFloat(document.getElementById('price').value);
                const description = document.getElementById('description').value;
                const isVisible = document.getElementById('is-visible').checked;

                const productData = { name, price, description, is_visible: isVisible };
                let productId;

                if (idString) {
                    productId = parseInt(idString);
                    const { error } = await supabase.from('products').update(productData).eq('id', productId);
                    if (error) throw error;
                } else {
                    const { data, error } = await supabase.from('products').insert([productData]).select().single();
                    if (error) throw error;
                    productId = data.id;
                }

                const rows = document.querySelectorAll('.variant-row');
                for (let row of rows) {
                    const vIdString = row.querySelector('.var-id').value;
                    const vName = row.querySelector('.var-name').value;
                    const vHex = row.querySelector('.var-hex').value;
                    const vImages = row.querySelector('.var-images').value;
                    const vSoldOut = row.querySelector('.var-sold-out').checked;

                    const vData = {
                        product_id: productId,
                        color_name: vName,
                        color_hex: vHex,
                        image_url: vImages,
                        is_sold_out: vSoldOut
                    };

                    if (vIdString) {
                        await supabase.from('product_variants').update(vData).eq('id', parseInt(vIdString));
                    } else {
                        await supabase.from('product_variants').insert([vData]);
                    }
                }

                if (deletedVariants.length > 0) {
                    await supabase.from('product_variants').delete().in('id', deletedVariants);
                }

                // Éxito visual sin molestos popups
                btn.innerHTML = '✅ ¡Guardado con éxito!';
                btn.classList.replace('bg-black', 'bg-green-600');
                
                setTimeout(() => {
                    resetProductForm();
                    switchTab('catalog');
                    btn.innerHTML = 'Guardar Producto Completo';
                    btn.classList.replace('bg-green-600', 'bg-black');
                    btn.disabled = false;
                }, 1200);

            } catch (err) {
                alert('Error al guardar: ' + err.message);
                btn.innerHTML = 'Guardar Producto Completo';
                btn.disabled = false;
            }
        });

        // --- EDITAR PRODUCTO ---
        window.editProduct = async function(id) {
            const { data: prod, error: errProd } = await supabase.from('products').select('*').eq('id', parseInt(id)).single();
            if (errProd) return alert("Error al cargar producto");

            document.getElementById('product-id').value = prod.id;
            document.getElementById('name').value = prod.name;
            document.getElementById('price').value = prod.price;
            document.getElementById('description').value = prod.description || '';
            document.getElementById('is-visible').checked = prod.is_visible !== false; 

            document.getElementById('variants-container').innerHTML = '';
            deletedVariants = [];
            const { data: variants, error: errVar } = await supabase.from('product_variants').select('*').eq('product_id', parseInt(id));
            
            if (!errVar && variants) {
                variants.forEach(v => addVariantRow(v));
            }

            document.getElementById('form-title').innerText = 'Editar Producto';
            switchTab('add');
        };

        // --- ELIMINAR PRODUCTO ---
        window.deleteProduct = async function(id) {
            if (confirm('¿Eliminar producto de forma permanente?')) {
                const { error } = await supabase.from('products').delete().eq('id', parseInt(id));
                if (error) alert('Error al eliminar: ' + error.message);
            }
        };

        // --- ACCIONES RÁPIDAS EN TIEMPO REAL (Botones de Catálogo) ---
        window.toggleVariantSoldOut = async function(variantId, newState) {
            const { error } = await supabase.from('product_variants').update({ is_sold_out: newState }).eq('id', parseInt(variantId));
            if (error) alert('Error: ' + error.message);
            // No recargamos, el Realtime disparará loadCatalog() automáticamente
        };

        window.toggleProductVisibility = async function(productId, newState) {
            const { error } = await supabase.from('products').update({ is_visible: newState }).eq('id', parseInt(productId));
            if (error) alert('Error: ' + error.message);
        };

        // --- CARGAR CATÁLOGO ---
        async function loadCatalog() {
            const tbody = document.getElementById('catalog-body');
            
            // Si está vacío ponemos cargando, si ya hay datos lo hace en background sin que parpadee feo
            if(tbody.innerHTML === '') tbody.innerHTML = '<tr><td class="p-4">Cargando catálogo...</td></tr>';
            
            const { data, error } = await supabase.from('products').select('*, product_variants(id, color_name, image_url, is_sold_out)').order('created_at', { ascending: false });

            if (error) return tbody.innerHTML = `<tr><td class="p-4 text-red-500">Error al cargar: ${error.message}</td></tr>`;
            if (!data || data.length === 0) return tbody.innerHTML = '<tr><td class="p-4 text-gray-500">No hay productos en el catálogo.</td></tr>';

            let html = `<tr class="bg-gray-50 border-b shadow-sm"><th class="p-4 font-bold text-gray-700">Img</th><th class="p-4 font-bold text-gray-700">Producto</th><th class="p-4 font-bold text-gray-700">Precio</th><th class="p-4 font-bold text-gray-700">Colores (Clic para cambiar estado)</th><th class="p-4 font-bold text-gray-700">Acciones</th></tr>`;
            
            data.forEach(p => {
                let firstImg = '';
                if (p.product_variants && p.product_variants.length > 0 && p.product_variants[0].image_url) {
                    firstImg = p.product_variants[0].image_url.split(',')[0];
                }

                const img = firstImg ? `<img src="${firstImg}" class="w-14 h-14 object-cover rounded-lg border shadow-sm">` : '<div class="w-14 h-14 bg-gray-200 rounded-lg shadow-sm border"></div>';
                
                // Botones interactivos de colores
                let variantsHtml = '';
                if (p.product_variants && p.product_variants.length > 0) {
                    variantsHtml = '<div class="flex flex-wrap gap-2">';
                    p.product_variants.forEach(v => {
                        const isAgotado = v.is_sold_out;
                        // Diseño dinámico según estado
                        const btnClass = isAgotado 
                            ? 'bg-red-50 text-red-700 border-red-300 hover:bg-red-100' 
                            : 'bg-green-50 text-green-700 border-green-300 hover:bg-green-100';
                        
                        variantsHtml += `
                            <button onclick="toggleVariantSoldOut('${v.id}', ${!isAgotado})" class="border px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-sm ${btnClass}">
                                <span class="w-2 h-2 rounded-full ${isAgotado ? 'bg-red-500' : 'bg-green-500 shadow-sm'}"></span>
                                ${v.color_name} ${isAgotado ? '(Agotado)' : ''}
                            </button>
                        `;
                    });
                    variantsHtml += '</div>';
                } else {
                    variantsHtml = '<span class="text-xs text-gray-400 font-medium">No tiene colores</span>';
                }

                // Botón interactivo de visibilidad general
                const visibleBtn = p.is_visible 
                    ? `<button onclick="toggleProductVisibility('${p.id}', false)" class="text-xs bg-blue-50 text-blue-700 border border-blue-200 px-2 py-1 rounded-md hover:bg-blue-100 font-bold ml-3 transition shadow-sm">👀 Visible</button>`
                    : `<button onclick="toggleProductVisibility('${p.id}', true)" class="text-xs bg-gray-100 text-gray-500 border border-gray-300 px-2 py-1 rounded-md hover:bg-gray-200 font-bold ml-3 transition shadow-sm">🙈 Oculto</button>`;

                html += `
                    <tr class="border-b hover:bg-white transition bg-gray-50/50">
                        <td class="p-4">${img}</td>
                        <td class="p-4 font-bold text-gray-900">
                            <div class="flex items-center">
                                ${p.name} 
                                ${visibleBtn}
                            </div>
                        </td>
                        <td class="p-4 font-medium">${p.price} €</td>
                        <td class="p-4">${variantsHtml}</td>
                        <td class="p-4">
                            <button onclick="editProduct('${p.id}')" class="text-blue-600 font-bold mr-3 hover:underline">Editar</button>
                            <button onclick="deleteProduct('${p.id}')" class="text-red-600 font-bold hover:underline">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // --- CARGAR PEDIDOS ---
        async function loadOrders() {
            const container = document.getElementById('orders-container');
            if(container.innerHTML === '') container.innerHTML = '<p>Cargando pedidos...</p>';

            const { data, error } = await supabase.from('orders').select('*').order('created_at', { ascending: false });

            if (error) return container.innerHTML = `<p class="text-red-500">Error al cargar pedidos: ${error.message}</p>`;
            if (!data || data.length === 0) return container.innerHTML = '<p class="text-gray-500">No hay pedidos registrados.</p>';

            let html = `<table class="w-full text-left border-collapse mt-4">
                <thead><tr class="bg-gray-50 border-b shadow-sm">
                    <th class="p-4 text-gray-700">Pedido / Fecha</th><th class="p-4 text-gray-700">Cliente</th><th class="p-4 text-gray-700">Artículos</th><th class="p-4 text-gray-700">Total</th><th class="p-4 text-gray-700">Estado</th>
                </tr></thead><tbody>`;

            data.forEach(order => {
                const date = new Date(order.created_at).toLocaleDateString('es-ES', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
                const isCompleted = (order.status || '').toLowerCase() === 'completado';
                
                const statusHtml = isCompleted 
                    ? `<span class="bg-green-100 text-green-800 text-xs font-bold px-3 py-1 rounded-full border border-green-200 shadow-sm">Completado</span>`
                    : `<span class="bg-yellow-100 text-yellow-800 text-xs font-bold px-3 py-1 rounded-full mb-2 inline-block border border-yellow-200 shadow-sm">Pendiente</span>
                       <button onclick="markOrderCompleted('${order.id}')" class="block text-xs bg-black text-white px-3 py-1.5 rounded-lg font-bold shadow hover:bg-gray-800 transition">Marcar Completado</button>`;

                let itemsList = '';
                if(order.items && Array.isArray(order.items) && order.items.length > 0) {
                    itemsList = '<ul class="text-sm text-gray-700 list-disc list-inside mt-1 font-medium bg-white p-3 rounded-lg border shadow-sm">';
                    order.items.forEach(item => {
                        const name = item.name || item.product_name || item.title || 'Producto';
                        const qty = item.quantity || item.qty || 1;
                        itemsList += `<li>${qty}x ${name}</li>`;
                    });
                    itemsList += '</ul>';
                }

                html += `
                    <tr class="border-b hover:bg-white transition bg-gray-50/50">
                        <td class="p-4 text-sm"><span class="font-bold text-gray-900">#${order.id}</span><br><span class="text-xs text-gray-500">${date}</span></td>
                        <td class="p-4 text-sm">
                            <b class="text-gray-900">${order.customer_name || 'Desconocido'}</b><br>
                            <span class="text-gray-600">📧 ${order.customer_email || 'Sin email'}</span><br>
                            <span class="text-gray-600">📞 ${order.customer_phone || 'Sin teléfono'}</span>
                        </td>
                        <td class="p-4">${itemsList || '<span class="text-gray-400 text-sm">Sin detalles</span>'}</td>
                        <td class="p-4 font-bold text-lg text-gray-900">${order.total_price || 0} €</td>
                        <td class="p-4">${statusHtml}</td>
                    </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        window.markOrderCompleted = async function(id) {
            if (confirm('¿Completar pedido?')) {
                const { error } = await supabase.from('orders').update({ status: 'Completado' }).eq('id', parseInt(id));
                if (error) alert("Error al completar: " + error.message);
            }
        };

    </script>
</body>
</html>
