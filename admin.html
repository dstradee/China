<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Éxito con Javi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8 font-sans text-gray-800">

    <!-- SECCIÓN DE LOGIN -->
    <div id="login-section" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-200 mt-20">
        <h2 class="text-2xl font-bold text-center mb-6">Acceso Administrador</h2>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Email</label>
                <input type="email" id="login-email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Contraseña</label>
                <input type="password" id="login-password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black outline-none">
            </div>
            <button type="submit" id="login-btn" class="w-full bg-black text-white font-bold py-3 rounded-lg hover:bg-gray-800 transition">Entrar</button>
            <p id="login-error" class="text-red-500 text-sm text-center hidden"></p>
        </form>
    </div>

    <!-- SECCIÓN DE ADMINISTRADOR (Oculta hasta que inicies sesión) -->
    <div id="admin-section" class="hidden max-w-5xl mx-auto">
        
        <!-- Menú de navegación superior -->
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <div class="flex gap-4">
                <button onclick="switchTab('add')" id="btn-tab-add" class="font-bold text-black border-b-2 border-black pb-1 focus:outline-none">Añadir Producto</button>
                <button onclick="switchTab('catalog')" id="btn-tab-catalog" class="font-bold text-gray-400 hover:text-black pb-1 focus:outline-none">Catálogo</button>
            </div>
            <button onclick="logout()" class="text-sm text-red-600 hover:underline font-semibold focus:outline-none">Cerrar Sesión</button>
        </div>

        <!-- Pestaña: Añadir Producto -->
        <div id="tab-add" class="bg-white p-8 rounded-xl shadow-md border border-gray-200">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h1 class="text-2xl font-bold text-gray-900">Añadir Nuevo Producto</h1>
                <a href="index.html" class="text-sm text-blue-600 hover:underline" target="_blank">Ver tienda</a>
            </div>

            <form id="product-form" class="space-y-6">
                <!-- DATOS BÁSICOS DEL PRODUCTO -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="col-span-1 md:col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre del producto *</label>
                        <input type="text" id="name" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black outline-none" placeholder="Ej: Zapatillas Urban">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Precio (€) *</label>
                        <input type="number" id="price" step="0.01" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black outline-none" placeholder="24.99">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Descripción</label>
                    <textarea id="description" rows="3" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black outline-none" placeholder="Describe el producto..."></textarea>
                </div>

                <!-- VARIANTES (COLORES Y FOTOS) -->
                <div class="border-t pt-6 mt-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-gray-900">Variantes (Colores y Fotos)</h2>
                        <button type="button" onclick="addVariantRow()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 text-sm px-4 py-2 rounded-lg font-medium transition">
                            + Añadir Color
                        </button>
                    </div>
                    
                    <div id="variants-container" class="space-y-4">
                        <!-- Las filas de variantes se insertan aquí -->
                    </div>
                </div>

                <!-- BOTÓN DE GUARDAR -->
                <div class="border-t pt-6 mt-8">
                    <button type="submit" id="submit-btn" class="w-full bg-black text-white font-bold py-3 rounded-lg hover:bg-gray-800 transition">
                        Guardar Producto en Base de Datos
                    </button>
                    <p id="status-msg" class="text-center mt-3 text-sm font-semibold hidden"></p>
                </div>
            </form>
        </div>

        <!-- Pestaña: Catálogo -->
        <div id="tab-catalog" class="hidden bg-white p-8 rounded-xl shadow-md border border-gray-200">
            <h2 class="text-2xl font-bold text-gray-900 mb-6 border-b pb-4">Tus Productos</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm">
                            <th class="p-3 border-b">ID</th>
                            <th class="p-3 border-b">Nombre</th>
                            <th class="p-3 border-b">Precio</th>
                            <th class="p-3 border-b">Estado</th>
                            <th class="p-3 border-b text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="catalog-body">
                        <!-- Se llena con JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div> <!-- Fin del contenedor admin-section -->

    <script>
        // ==========================================
        // 1. CONFIGURACIÓN
        // ==========================================
        const supabaseUrl = 'https://koignwzdqxcilwieqijq.supabase.co'; 
        const supabaseAnonKey = 'sb_publishable__bw11mniMfgl_R9JWyL7SA_aPKqltNa';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        const cloudinaryCloudName = 'dkg1ytbxb'; 
        const cloudinaryUploadPreset = 'tienda_ropa'; 

        // ==========================================
        // 2. AUTENTICACIÓN MEJORADA
        // ==========================================
        
        // Función para actualizar la interfaz según si hay sesión o no
        function updateUI(session) {
            if (session) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
                loadCatalog(); // Carga la lista de ropa al entrar
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('admin-section').classList.add('hidden');
            }
        }

        // Comprobación inicial forzada nada más cargar la página
        async function checkInitialSession() {
            const { data: { session } } = await supabase.auth.getSession();
            updateUI(session);
        }

        // Listener para cambios de estado (cuando te logueas o deslogueas)
        supabase.auth.onAuthStateChange((_event, session) => {
            updateUI(session);
        });

        // Ejecutar comprobación al cargar
        document.addEventListener('DOMContentLoaded', () => {
            checkInitialSession();
            addVariantRow(); // Añadir la primera fila de variantes por defecto
        });

        // Login form
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            const errorMsg = document.getElementById('login-error');
            
            btn.innerText = 'Comprobando...';
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            const { error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                errorMsg.innerText = 'Correo o contraseña incorrectos.';
                errorMsg.classList.remove('hidden');
            }
            
            btn.innerText = 'Entrar';
            btn.disabled = false;
        });

        async function logout() {
            await supabase.auth.signOut();
        }

        // ==========================================
        // 3. NAVEGACIÓN (PESTAÑAS)
        // ==========================================
        function switchTab(tab) {
            document.getElementById('tab-add').classList.toggle('hidden', tab !== 'add');
            document.getElementById('tab-catalog').classList.toggle('hidden', tab !== 'catalog');
            
            document.getElementById('btn-tab-add').className = tab === 'add' ? 'font-bold text-black border-b-2 border-black pb-1 focus:outline-none' : 'font-bold text-gray-400 hover:text-black pb-1 focus:outline-none';
            document.getElementById('btn-tab-catalog').className = tab === 'catalog' ? 'font-bold text-black border-b-2 border-black pb-1 focus:outline-none' : 'font-bold text-gray-400 hover:text-black pb-1 focus:outline-none';
            
            if(tab === 'catalog') loadCatalog();
        }

        // ==========================================
        // 4. CATÁLOGO (LEER, OCULTAR Y BORRAR)
        // ==========================================
        async function loadCatalog() {
            const tbody = document.getElementById('catalog-body');
            tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center font-medium">Cargando catálogo...</td></tr>';
            
            const { data, error } = await supabase.from('products').select('*').order('created_at', { ascending: false });
            
            if (error) {
                console.error(error);
                tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-red-500 font-bold">Error al cargar productos.</td></tr>';
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-500">Aún no hay productos subidos.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(p => `
                <tr class="border-b hover:bg-gray-50 transition-colors">
                    <td class="p-3 text-sm text-gray-500">#${p.id}</td>
                    <td class="p-3 font-semibold text-gray-800">${p.name}</td>
                    <td class="p-3 text-gray-800">${p.price} €</td>
                    <td class="p-3">
                        <span class="px-2 py-1 text-xs rounded-full font-medium ${p.is_visible ? 'bg-green-100 text-green-800' : 'bg-gray-200 text-gray-600'}">
                            ${p.is_visible ? 'Visible' : 'Oculto'}
                        </span>
                    </td>
                    <td class="p-3 text-right space-x-3">
                        <button onclick="toggleVisibility(${p.id}, ${p.is_visible})" class="text-sm font-bold ${p.is_visible ? 'text-yellow-600 hover:text-yellow-700' : 'text-green-600 hover:text-green-700'} transition">
                            ${p.is_visible ? 'Ocultar' : 'Mostrar'}
                        </button>
                        <button onclick="deleteProduct(${p.id})" class="text-sm font-bold text-red-600 hover:text-red-800 transition">Borrar</button>
                    </td>
                </tr>
            `).join('');
        }

        async function toggleVisibility(id, currentStatus) {
            const { error } = await supabase.from('products').update({ is_visible: !currentStatus }).eq('id', id);
            if (!error) loadCatalog();
            else alert("Error al cambiar visibilidad");
        }

        async function deleteProduct(id) {
            if (!confirm("¿Seguro que quieres borrar este producto? (La foto no se borrará de Cloudinary por seguridad)")) return;
            const { error } = await supabase.from('products').delete().eq('id', id);
            if (!error) loadCatalog();
            else {
                console.error(error);
                alert("Error al borrar el producto");
            }
        }

        // ==========================================
        // 5. GESTIÓN DE VARIANTES (INTERFAZ)
        // ==========================================
        let variantCount = 0;

        function addVariantRow() {
            variantCount++;
            const id = variantCount;
            
            const row = document.createElement('div');
            row.className = 'flex flex-wrap md:flex-nowrap items-end gap-4 bg-gray-50 p-4 rounded-lg border border-gray-200';
            row.id = `variant-${id}`;
            
            row.innerHTML = `
                <div class="w-full md:w-1/4">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre Color</label>
                    <input type="text" class="variant-name w-full px-3 py-2 border rounded focus:ring-1 focus:ring-black outline-none" placeholder="Ej: Rojo" required>
                </div>
                <div class="w-full md:w-1/6">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Color (Hex)</label>
                    <input type="color" class="variant-hex w-full h-10 p-1 cursor-pointer border rounded" value="#000000">
                </div>
                <div class="w-full md:w-2/5 flex flex-col">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Foto (Cloudinary)</label>
                    <div class="flex gap-2">
                        <button type="button" onclick="openCloudinaryWidget(${id})" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded text-sm font-bold transition whitespace-nowrap">
                            Subir Foto
                        </button>
                        <input type="text" id="image-url-${id}" class="variant-image w-full px-3 py-2 border rounded bg-gray-200 text-xs text-gray-500" placeholder="URL de la imagen..." readonly required>
                    </div>
                </div>
                <div class="w-full md:w-auto">
                    <button type="button" onclick="removeVariantRow(${id})" class="text-red-500 hover:text-red-700 font-black p-2" title="Eliminar variante">X</button>
                </div>
            `;
            document.getElementById('variants-container').appendChild(row);
        }

        function removeVariantRow(id) {
            document.getElementById(`variant-${id}`).remove();
        }

        // ==========================================
        // 6. INTEGRACIÓN CLOUDINARY
        // ==========================================
        function openCloudinaryWidget(variantId) {
            let myWidget = cloudinary.createUploadWidget({
                cloudName: cloudinaryCloudName, 
                uploadPreset: cloudinaryUploadPreset,
                sources: ['local', 'url', 'camera'],
                multiple: false,
                maxFiles: 1,
                resourceType: "image"
            }, (error, result) => { 
                if (!error && result && result.event === "success") { 
                    document.getElementById(`image-url-${variantId}`).value = result.info.secure_url;
                }
            });
            
            myWidget.open();
        }

        // ==========================================
        // 7. GUARDAR EN SUPABASE
        // ==========================================
        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submit-btn');
            const msg = document.getElementById('status-msg');
            
            btn.disabled = true;
            btn.innerText = "Guardando...";
            msg.className = "text-center mt-3 text-sm font-semibold hidden";

            try {
                const name = document.getElementById('name').value;
                const price = parseFloat(document.getElementById('price').value);
                const description = document.getElementById('description').value;

                const { data: productData, error: productError } = await supabase
                    .from('products')
                    .insert([{ name, price, description }])
                    .select(); 

                if (productError) throw productError;
                const productId = productData[0].id;

                const variantRows = document.querySelectorAll('#variants-container > div');
                const variantsToInsert = [];

                variantRows.forEach(row => {
                    variantsToInsert.push({
                        product_id: productId,
                        color_name: row.querySelector('.variant-name').value,
                        color_hex: row.querySelector('.variant-hex').value,
                        image_url: row.querySelector('.variant-image').value
                    });
                });

                if (variantsToInsert.length > 0) {
                    const { error: variantError } = await supabase
                        .from('product_variants')
                        .insert(variantsToInsert);

                    if (variantError) throw variantError;
                }

                msg.innerText = "¡Producto guardado correctamente!";
                msg.className = "text-center mt-3 text-sm font-semibold text-green-600 block";
                document.getElementById('product-form').reset();
                document.getElementById('variants-container').innerHTML = '';
                addVariantRow(); 

            } catch (error) {
                console.error("Error al guardar:", error);
                msg.innerText = "Error al guardar. Asegúrate de rellenar todos los campos.";
                msg.className = "text-center mt-3 text-sm font-semibold text-red-600 block";
            } finally {
                btn.disabled = false;
                btn.innerText = "Guardar Producto en Base de Datos";
            }
        });
    </script>
</body>
</html>
