<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Éxito con Javi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8 font-sans text-gray-800">

    <!-- SECCIÓN DE LOGIN -->
    <div id="login-section" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-200 mt-20">
        <h2 class="text-2xl font-bold text-center mb-6">Acceso Administrador</h2>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Email</label>
                <input type="email" id="login-email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black outline-none" autocomplete="username">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Contraseña</label>
                <input type="password" id="login-password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black outline-none" autocomplete="current-password">
            </div>
            <button type="submit" id="login-btn" class="w-full bg-black text-white font-bold py-3 rounded-lg hover:bg-gray-800 transition">Entrar</button>
            <div id="login-error" class="bg-red-50 border-l-4 border-red-500 p-4 mt-4 hidden">
                <p class="text-red-700 text-sm font-semibold" id="login-error-text"></p>
            </div>
        </form>
    </div>

    <!-- SECCIÓN DE ADMINISTRADOR (Oculta hasta que inicies sesión) -->
    <div id="admin-section" class="hidden max-w-5xl mx-auto">
        
        <!-- Menú de navegación superior -->
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <div class="flex gap-4">
                <button onclick="switchTab('add')" id="btn-tab-add" class="font-bold text-black border-b-2 border-black pb-1 focus:outline-none">Añadir/Editar Producto</button>
                <button onclick="switchTab('catalog')" id="btn-tab-catalog" class="font-bold text-gray-400 hover:text-black pb-1 focus:outline-none">Catálogo</button>
                <button onclick="switchTab('orders')" id="btn-tab-orders" class="font-bold text-gray-400 hover:text-black pb-1 focus:outline-none flex items-center gap-2">
                    Pedidos <span id="orders-badge" class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full hidden">0</span>
                </button>
            </div>
            <button onclick="logout()" class="text-sm text-red-600 hover:underline font-semibold focus:outline-none">Cerrar Sesión</button>
        </div>

        <!-- Pestaña: Añadir/Editar Producto -->
        <div id="tab-add" class="bg-white p-8 rounded-xl shadow-md border border-gray-200">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h1 class="text-2xl font-bold text-gray-900" id="form-title">Añadir Nuevo Producto</h1>
                <div class="flex items-center gap-4">
                    <button type="button" id="btn-cancel-edit" onclick="cancelEdit()" class="hidden text-sm font-bold text-red-600 hover:text-red-800">Cancelar Edición</button>
                    <a href="index.html" class="text-sm text-blue-600 hover:underline" target="_blank">Ver tienda</a>
                </div>
            </div>

            <form id="product-form" class="space-y-6">
                <!-- DATOS BÁSICOS DEL PRODUCTO -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="col-span-1 md:col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre del producto *</label>
                        <input type="text" id="name" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black outline-none" placeholder="Ej: Zapatillas Urban">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Precio (€) *</label>
                        <input type="number" id="price" step="0.01" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black outline-none" placeholder="24.99">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Descripción</label>
                    <textarea id="description" rows="3" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black outline-none" placeholder="Describe el producto..."></textarea>
                </div>

                <!-- VARIANTES (COLORES Y FOTOS) -->
                <div class="border-t pt-6 mt-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-gray-900">Variantes (Colores y Fotos)</h2>
                        <button type="button" onclick="addVariantRow()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 text-sm px-4 py-2 rounded-lg font-medium transition focus:outline-none">
                            + Añadir Color
                        </button>
                    </div>
                    
                    <div id="variants-container" class="space-y-4">
                        <!-- Las filas de variantes se insertan aquí -->
                    </div>
                </div>

                <!-- BOTÓN DE GUARDAR -->
                <div class="border-t pt-6 mt-8">
                    <button type="submit" id="submit-btn" class="w-full bg-black text-white font-bold py-3 rounded-lg hover:bg-gray-800 transition focus:outline-none">
                        Guardar Producto en Base de Datos
                    </button>
                    <p id="status-msg" class="text-center mt-3 text-sm font-semibold hidden"></p>
                </div>
            </form>
        </div>

        <!-- Pestaña: Catálogo -->
        <div id="tab-catalog" class="hidden bg-white p-8 rounded-xl shadow-md border border-gray-200">
            <h2 class="text-2xl font-bold text-gray-900 mb-6 border-b pb-4">Tus Productos</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm">
                            <th class="p-3 border-b w-16">ID</th>
                            <th class="p-3 border-b">Nombre</th>
                            <th class="p-3 border-b">Precio</th>
                            <th class="p-3 border-b">Estado</th>
                            <th class="p-3 border-b text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="catalog-body">
                        <!-- Se llena con JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pestaña: Pedidos (NUEVA) -->
        <div id="tab-orders" class="hidden bg-white p-8 rounded-xl shadow-md border border-gray-200">
            <h2 class="text-2xl font-bold text-gray-900 mb-6 border-b pb-4">Órdenes Pendientes</h2>
            <div id="orders-container" class="space-y-4">
                <!-- Los pedidos se inyectan aquí -->
            </div>
        </div>

    </div> <!-- Fin del contenedor admin-section -->

    <script>
        // ==========================================
        // 1. CONFIGURACIÓN (Intacta)
        // ==========================================
        var supabaseUrl = 'https://koignwzdqxcilwieqijq.supabase.co'; 
        var supabaseAnonKey = 'sb_publishable__bw11mniMfgl_R9JWyL7SA_aPKqltNa';
        var supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        var cloudinaryCloudName = 'dkg1ytbxb'; 
        var cloudinaryUploadPreset = 'tienda_ropa'; 

        // Variables Globales de Estado
        var catalogProducts = []; 
        var editingProductId = null; // Si no es null, estamos en "Modo Edición"

        // ==========================================
        // 2. AUTENTICACIÓN (Intacta, 100% prohibido tocar)
        // ==========================================
        function updateUI(session) {
            var loginSection = document.getElementById('login-section');
            var adminSection = document.getElementById('admin-section');
            
            if (session) {
                loginSection.classList.add('hidden');
                adminSection.classList.remove('hidden');
                loadCatalog();
                loadOrders(); // Cargamos pedidos al entrar
            } else {
                loginSection.classList.remove('hidden');
                adminSection.classList.add('hidden');
            }
        }

        async function checkInitialSession() {
            try {
                const { data: { session }, error } = await supabase.auth.getSession();
                if (error) console.error("Error comprobando sesión:", error);
                updateUI(session);
            } catch (err) {
                console.error("Error crítico en checkInitialSession:", err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkInitialSession();
            addVariantRow();
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            var email = document.getElementById('login-email').value;
            var password = document.getElementById('login-password').value;
            var btn = document.getElementById('login-btn');
            var errorContainer = document.getElementById('login-error');
            var errorText = document.getElementById('login-error-text');
            
            btn.innerText = 'Comprobando datos...';
            btn.disabled = true;
            errorContainer.classList.add('hidden');

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email: email, password: password });
                if (error) {
                    let mensajeAmigable = error.message;
                    if (error.message.includes('Invalid login credentials')) {
                        mensajeAmigable = 'Correo o contraseña incorrectos. Revisa bien si has puesto alguna mayúscula.';
                    } else if (error.message.includes('Email not confirmed')) {
                        mensajeAmigable = '¡Atención! Aún no has confirmado este usuario. Ve a Supabase > Authentication > Users y marca tu usuario como confirmado.';
                    }
                    errorText.innerText = mensajeAmigable;
                    errorContainer.classList.remove('hidden');
                } else if (data.session) {
                    document.getElementById('login-form').reset();
                    updateUI(data.session);
                }
            } catch (err) {
                errorText.innerText = "Error en la conexión. Revisa la consola.";
                errorContainer.classList.remove('hidden');
            } finally {
                btn.innerText = 'Entrar';
                btn.disabled = false;
            }
        });

        async function logout() {
            const { error } = await supabase.auth.signOut();
            updateUI(null);
        }

        // ==========================================
        // 3. NAVEGACIÓN (PESTAÑAS)
        // ==========================================
        function switchTab(tab) {
            document.getElementById('tab-add').classList.toggle('hidden', tab !== 'add');
            document.getElementById('tab-catalog').classList.toggle('hidden', tab !== 'catalog');
            document.getElementById('tab-orders').classList.toggle('hidden', tab !== 'orders');
            
            const activeClass = 'font-bold text-black border-b-2 border-black pb-1 focus:outline-none flex items-center gap-2';
            const inactiveClass = 'font-bold text-gray-400 hover:text-black pb-1 focus:outline-none flex items-center gap-2';
            
            document.getElementById('btn-tab-add').className = tab === 'add' ? activeClass : inactiveClass;
            document.getElementById('btn-tab-catalog').className = tab === 'catalog' ? activeClass : inactiveClass;
            document.getElementById('btn-tab-orders').className = tab === 'orders' ? activeClass : inactiveClass;
            
            if(tab === 'catalog') loadCatalog();
            if(tab === 'orders') loadOrders();
        }

        // ==========================================
        // 4. CATÁLOGO Y EDICIÓN
        // ==========================================
        async function loadCatalog() {
            var tbody = document.getElementById('catalog-body');
            tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center font-medium">Cargando catálogo...</td></tr>';
            
            try {
                // Traemos todo: productos y sus variantes
                const { data, error } = await supabase.from('products').select('*, variants:product_variants(*)').order('created_at', { ascending: false });
                
                if (error) {
                    tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-red-500 font-bold">Error al cargar productos.</td></tr>';
                    return;
                }

                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-500">Aún no hay productos subidos.</td></tr>';
                    return;
                }

                catalogProducts = data; // Guardamos en memoria para poder editar rápido

                tbody.innerHTML = data.map(p => `
                    <tr class="border-b hover:bg-gray-50 transition-colors">
                        <td class="p-3 text-sm text-gray-500 font-mono">#${p.id}</td>
                        <td class="p-3 font-semibold text-gray-800">${p.name}</td>
                        <td class="p-3 text-gray-800">${p.price} €</td>
                        <td class="p-3">
                            <span class="px-2 py-1 text-xs rounded-full font-medium ${p.is_visible ? 'bg-green-100 text-green-800' : 'bg-gray-200 text-gray-600'}">
                                ${p.is_visible ? 'Visible' : 'Oculto'}
                            </span>
                        </td>
                        <td class="p-3 text-right space-x-2 whitespace-nowrap">
                            <button onclick="editProduct(${p.id})" class="text-sm font-bold text-blue-600 hover:text-blue-800 transition">Editar</button>
                            <span class="text-gray-300">|</span>
                            <button onclick="toggleVisibility(${p.id}, ${p.is_visible})" class="text-sm font-bold ${p.is_visible ? 'text-yellow-600 hover:text-yellow-700' : 'text-green-600 hover:text-green-700'} transition">
                                ${p.is_visible ? 'Ocultar' : 'Mostrar'}
                            </button>
                            <span class="text-gray-300">|</span>
                            <button onclick="deleteProduct(${p.id})" class="text-sm font-bold text-red-600 hover:text-red-800 transition">Borrar</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("Error en loadCatalog:", err);
            }
        }

        async function toggleVisibility(id, currentStatus) {
            try {
                const { error } = await supabase.from('products').update({ is_visible: !currentStatus }).eq('id', id);
                if (!error) loadCatalog();
                else alert("Error al cambiar la visibilidad.");
            } catch (err) { console.error(err); }
        }

        async function deleteProduct(id) {
            if (!confirm("¿Seguro que quieres borrar este producto para siempre?")) return;
            try {
                const { error } = await supabase.from('products').delete().eq('id', id);
                if (!error) loadCatalog();
                else alert("Error al borrar el producto.");
            } catch (err) { console.error(err); }
        }

        // ==========================================
        // LÓGICA MODO EDICIÓN
        // ==========================================
        function editProduct(id) {
            const product = catalogProducts.find(p => p.id === id);
            if (!product) return;

            editingProductId = product.id; // Activamos modo edición

            // Cambiamos textos
            document.getElementById('form-title').innerText = `Editar Producto #${product.id}: ${product.name}`;
            document.getElementById('submit-btn').innerText = "Actualizar Producto";
            document.getElementById('btn-cancel-edit').classList.remove('hidden');

            // Rellenamos datos básicos
            document.getElementById('name').value = product.name;
            document.getElementById('price').value = product.price;
            document.getElementById('description').value = product.description || '';

            // Limpiamos colores y cargamos los que tiene
            document.getElementById('variants-container').innerHTML = '';
            variantCount = 0;

            if (product.variants && product.variants.length > 0) {
                product.variants.forEach(variant => {
                    addVariantRow();
                    const currentRowId = `variant-${variantCount}`;
                    const row = document.getElementById(currentRowId);
                    
                    row.querySelector('.variant-name').value = variant.color_name;
                    row.querySelector('.variant-hex').value = variant.color_hex;
                    row.querySelector('.variant-image').value = variant.image_url || '';
                    row.querySelector('.variant-sold-out').checked = variant.is_sold_out || false;
                });
            } else {
                addVariantRow(); // Fila vacía si por algún error no tenía
            }

            switchTab('add'); // Saltamos a la pestaña
            window.scrollTo(0, 0); // Subimos arriba
        }

        function cancelEdit() {
            editingProductId = null;
            document.getElementById('form-title').innerText = `Añadir Nuevo Producto`;
            document.getElementById('submit-btn').innerText = "Guardar Producto en Base de Datos";
            document.getElementById('btn-cancel-edit').classList.add('hidden');
            
            document.getElementById('product-form').reset();
            document.getElementById('variants-container').innerHTML = '';
            addVariantRow();
        }

        // ==========================================
        // 5. GESTIÓN DE VARIANTES (INTERFAZ)
        // ==========================================
        var variantCount = 0;

        function addVariantRow() {
            variantCount++;
            var id = variantCount;
            
            var row = document.createElement('div');
            row.className = 'flex flex-wrap md:flex-nowrap items-end gap-4 bg-gray-50 p-4 rounded-lg border border-gray-200 relative';
            row.id = `variant-${id}`;
            
            row.innerHTML = `
                <div class="w-full md:w-1/5">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre Color</label>
                    <input type="text" class="variant-name w-full px-3 py-2 border rounded focus:ring-1 focus:ring-black outline-none" placeholder="Ej: Rojo" required>
                </div>
                <div class="w-full md:w-20">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Color</label>
                    <input type="color" class="variant-hex w-full h-10 p-1 cursor-pointer border rounded" value="#000000">
                </div>
                <div class="w-full md:flex-1 flex flex-col">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Fotos (Cloudinary)</label>
                    <div class="flex gap-2">
                        <button type="button" onclick="openCloudinaryWidget(${id})" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded text-sm font-bold transition whitespace-nowrap focus:outline-none">
                            Añadir Foto
                        </button>
                        <input type="text" id="image-url-${id}" class="variant-image w-full px-3 py-2 border rounded bg-gray-200 text-xs text-gray-600" placeholder="URLs de imágenes separadas por coma..." required>
                    </div>
                </div>
                <!-- CHECKBOX AGOTADO -->
                <div class="w-full md:w-24 flex items-center justify-center bg-white border rounded h-10 mt-5 md:mt-0">
                    <label class="flex items-center space-x-2 cursor-pointer w-full h-full justify-center px-2">
                        <input type="checkbox" class="variant-sold-out form-checkbox
