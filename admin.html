    <!-- Lógica de la aplicación -->
    <script>
        // ==========================================
        // 0. CONFIGURACIÓN DE SUPABASE
        // ==========================================
        var supabaseUrl = 'https://koignwzdqxcilwieqijq.supabase.co'; 
        var supabaseAnonKey = 'sb_publishable__bw11mniMfgl_R9JWyL7SA_aPKqltNa';
        
        let supabase;
        try {
            supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
        } catch(e) {
            console.warn("Falta configurar la URL de Supabase.");
        }

        // Variables globales
        let appProducts = []; 
        let currentModalProduct = null;
        let currentVariantIndex = 0; 
        
        // Memoria del carrito (Local Storage)
        let cart = JSON.parse(localStorage.getItem('nardo_cart')) || [];

        // Función auxiliar: si un color aún no tiene foto de Cloudinary, mostramos esto
<!-- ... existing code ... -->

        function changeModalImage(variantIndex) {

            const variant = currentModalProduct.variants[variantIndex];

            const buttons = document.querySelectorAll('.modal-color-btn');
<!-- ... existing code ... -->
            setTimeout(() => {

            }, 10);

            document.getElementById('modal-qty').value = 1; // Reseteamos la cantidad a 1 al abrir

        function closeModal() {
<!-- ... existing code ... -->
        document.getElementById('product-modal').addEventListener('click', function(event) {
            if (event.target === this) closeModal();
        });

        // ==========================================
        // 3.5. LÓGICA DEL CARRITO Y PEDIDOS
        // ==========================================
        
        // Cambiar cantidad en el modal (Botones + / -)
        function changeModalQty(change) {
            const qtyInput = document.getElementById('modal-qty');
            let current = parseInt(qtyInput.value);
            let newVal = current + change;
            if (newVal < 1) newVal = 1;
            if (newVal > 500) newVal = 500;
            qtyInput.value = newVal;
        }

        function addToCart() {
            if (!currentModalProduct) return;
            
            const variant = currentModalProduct.variants[currentVariantIndex];
            const qty = parseInt(document.getElementById('modal-qty').value);
            
            // Comprobamos si EXACTAMENTE ese producto con ESE color ya está en el carrito
            const existingItemIndex = cart.findIndex(item => item.productId === currentModalProduct.id && item.variantIndex === currentVariantIndex);
            
            if (existingItemIndex > -1) {
                // Si existe, le sumamos la cantidad (límite 500)
                cart[existingItemIndex].quantity += qty;
                if(cart[existingItemIndex].quantity > 500) cart[existingItemIndex].quantity = 500;
            } else {
                // Si no, lo metemos como nuevo
                cart.push({
                    productId: currentModalProduct.id,
                    variantIndex: currentVariantIndex,
                    name: currentModalProduct.name,
                    price: currentModalProduct.price,
                    colorName: variant.color_name,
                    colorHex: variant.color_hex,
                    imageUrl: variant.image_url,
                    quantity: qty
                });
            }
            
            saveCart();
            updateCartUI();
            closeModal();
            toggleCart(); // Desplegamos el carrito para que vea que se añadió
        }

        function saveCart() {
            localStorage.setItem('nardo_cart', JSON.stringify(cart));
            updateCartBadge();
        }

        function updateCartBadge() {
            const badge = document.getElementById('cart-badge');
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            
            if (totalItems > 0) {
                badge.innerText = totalItems > 99 ? '99+' : totalItems;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function toggleCart() {
            const panel = document.getElementById('cart-panel');
            const overlay = document.getElementById('cart-overlay');
            const isClosed = panel.classList.contains('translate-x-full');
            
            if (isClosed) {
                updateCartUI(); // Refrescar vista
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
                panel.classList.remove('translate-x-full');
                
                // Reiniciar el checkout
                document.getElementById('checkout-form').classList.add('hidden');
                document.getElementById('checkout-msg').classList.add('hidden');
            } else {
                panel.classList.add('translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCart();
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            const btnShowCheckout = document.getElementById('btn-show-checkout');
            const formCheckout = document.getElementById('checkout-form');
            
            container.innerHTML = '';
            let total = 0;
            
            if (cart.length === 0) {
                container.innerHTML = '<div class="h-full flex items-center justify-center text-gray-400 font-medium">Tu carrito está vacío</div>';
                btnShowCheckout.classList.add('hidden');
                formCheckout.classList.add('hidden');
            } else {
                cart.forEach((item, index) => {
                    total += item.price * item.quantity;
                    
                    const imgHtml = item.imageUrl 
                        ? `<img src="${item.imageUrl}" class="w-16 h-16 object-cover rounded-md border border-gray-200">`
                        : `<div class="w-16 h-16 rounded-md border border-gray-200 bg-gray-50 flex items-center justify-center"><div class="w-6 h-6 rounded-full" style="background-color: ${item.colorHex}"></div></div>`;

                    container.innerHTML += `
                        <div class="flex gap-4 items-center bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
                            ${imgHtml}
                            <div class="flex-1">
                                <h4 class="font-bold text-gray-900 text-sm">${item.name}</h4>
                                <div class="flex items-center gap-2 mt-1">
                                    <div class="w-3 h-3 rounded-full border border-gray-300" style="background-color: ${item.colorHex}"></div>
                                    <span class="text-xs text-gray-500">${item.colorName}</span>
                                </div>
                                <div class="flex justify-between items-center mt-2">
                                    <span class="font-black text-gray-900">${item.price} € x ${item.quantity}</span>
                                </div>
                            </div>
                            <button onclick="removeFromCart(${index})" class="text-gray-400 hover:text-red-500 transition focus:outline-none p-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>
                    `;
                });
                
                if(formCheckout.classList.contains('hidden')) {
                    btnShowCheckout.classList.remove('hidden');
                }
            }
            
            totalEl.innerText = total.toFixed(2) + ' €';
        }

        function showCheckout() {
            document.getElementById('btn-show-checkout').classList.add('hidden');
            document.getElementById('checkout-form').classList.remove('hidden');
        }

        // ENVIAR EL PEDIDO A LA BASE DE DATOS
        document.getElementById('checkout-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (cart.length === 0) return;

            const btn = document.getElementById('btn-submit-order');
            const msg = document.getElementById('checkout-msg');
            
            const name = document.getElementById('order-name').value;
            const email = document.getElementById('order-email').value;
            const phone = document.getElementById('order-phone').value;
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            btn.innerText = "Procesando...";
            btn.disabled = true;
            msg.classList.add('hidden');

            try {
                // Guardamos en la nueva tabla 'orders'
                const { error } = await supabase.from('orders').insert([{
                    customer_name: name,
                    customer_email: email,
                    customer_phone: phone,
                    items: cart, // Supabase guarda todo el carrito mágicamente aquí
                    total_price: total,
                    status: 'Pendiente'
                }]);

                if (error) throw error;

                // Éxito: vaciamos carrito
                cart = [];
                saveCart();
                document.getElementById('checkout-form').reset();
                document.getElementById('checkout-form').classList.add('hidden');
                
                // Mostrar pantalla de éxito
                const container = document.getElementById('cart-items');
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-center space-y-4 px-4">
                        <div class="w-16 h-16 bg-green-100 text-green-500 rounded-full flex items-center justify-center mb-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </div>
                        <h3 class="text-xl font-bold text-gray-900">¡Pedido Enviado!</h3>
                        <p class="text-gray-500 text-sm">Nos pondremos en contacto contigo pronto para gestionar el pago y envío.</p>
                    </div>
                `;
                document.getElementById('cart-total').innerText = '0.00 €';

            } catch (error) {
                console.error("Error al enviar orden:", error);
                msg.innerText = "Error de conexión. Inténtalo de nuevo.";
                msg.className = "text-center font-bold mt-4 text-red-500 block";
            } finally {
                btn.innerText = "Enviar orden";
                btn.disabled = false;
            }
        });

        // ==========================================
        // 4. CONEXIÓN A SUPABASE Y DATOS
        // ==========================================
<!-- ... existing code ... -->

            fetchAndLoadProducts();

            updateCartBadge(); // Cargamos el número rojo del carrito al iniciar
        });

    </script>
