<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éxito con Javi | Escaparate</title>
    <!-- Tailwind CSS para el diseño rápido y limpio -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nardo: '#686A6C', // Gris Nardo personalizado
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-nardo min-h-screen font-sans text-gray-800 selection:bg-black selection:text-white">

    <!-- Cabecera sencilla y Premium -->
    <header class="bg-white/10 backdrop-blur-md shadow-sm sticky top-0 z-40 border-b border-white/5">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black text-white tracking-widest uppercase drop-shadow-sm">Éxito con Javi</h1>
            <!-- Botón de carrito -->
            <button onclick="toggleCart()" class="text-white hover:scale-110 transition-transform duration-300 focus:outline-none relative bg-black/10 p-2.5 rounded-full hover:bg-black/20">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
                <span id="cart-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full hidden shadow-md border-2 border-nardo">0</span>
            </button>
        </div>
    </header>

    <!-- Contenedor Principal de Productos -->
    <main class="max-w-6xl mx-auto px-4 py-8 md:py-12">
        
        <!-- Sección de Título y Buscador -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10">
            <div>
                <h2 class="text-3xl md:text-4xl font-black text-white mb-1 tracking-tight drop-shadow-sm">Novedades</h2>
                <p class="text-gray-100 text-base font-medium opacity-90">Echa un vistazo a las últimas prendas.</p>
            </div>
            
            <!-- Buscador en tiempo real -->
            <div class="relative w-full md:w-96 group">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <svg class="w-5 h-5 text-gray-400 group-focus-within:text-black transition-colors duration-300" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
                <input type="text" id="search-input" onkeyup="filterProducts()" class="w-full pl-11 pr-4 py-3.5 bg-white/90 backdrop-blur-md rounded-2xl shadow-lg hover:shadow-xl focus:bg-white focus:shadow-2xl focus:ring-4 focus:ring-black/10 outline-none transition-all duration-300 font-semibold text-gray-800 placeholder-gray-500" placeholder="Buscar prendas (ej. Bañador)...">
            </div>
        </div>

        <!-- Cuadrícula de productos -->
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
            <!-- Los productos se cargarán aquí dinámicamente -->
        </div>
    </main>

    <!-- MODAL DEL PRODUCTO (Pantalla completa / emergente) -->
    <div id="product-modal" class="fixed inset-0 z-50 hidden bg-black/90 backdrop-blur-sm flex items-end md:items-center justify-center md:p-6 opacity-0 transition-opacity duration-300">
        
        <!-- Contenedor del Modal: Estilo "App" en móvil, Gigante en PC -->
        <div class="bg-white rounded-t-3xl md:rounded-3xl shadow-2xl w-full max-w-[100vw] md:max-w-6xl h-[92vh] md:h-[85vh] overflow-hidden flex flex-col md:flex-row relative transform translate-y-full md:translate-y-0 md:scale-95 transition-transform duration-300" id="modal-content">
            
            <!-- Botón de cerrar -->
            <button onclick="closeModal()" class="absolute top-4 right-4 z-20 bg-white/80 hover:bg-white hover:scale-110 rounded-full p-2.5 text-gray-900 shadow-lg backdrop-blur-md transition-all duration-300 focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>

            <!-- Zona de la Imagen del Modal con Carrusel -->
            <div class="w-full md:w-3/5 bg-gray-50 relative flex items-center justify-center h-1/2 md:h-full shrink-0 group">
                <!-- Contenedor de la foto activa -->
                <div id="modal-image-container" class="w-full h-full relative"></div>
                
                <!-- Flechas del Carrusel -->
                <div id="carousel-arrows" class="absolute inset-x-0 top-1/2 -translate-y-1/2 flex justify-between px-4 pointer-events-none hidden z-10">
                    <button onclick="prevImage(event)" class="pointer-events-auto bg-white/90 hover:bg-white text-black p-3 rounded-full shadow-lg backdrop-blur-md transition-transform hover:scale-110 focus:outline-none">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>
                    <button onclick="nextImage(event)" class="pointer-events-auto bg-white/90 hover:bg-white text-black p-3 rounded-full shadow-lg backdrop-blur-md transition-transform hover:scale-110 focus:outline-none">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </div>

                <!-- Indicador de página -->
                <div id="carousel-indicator" class="absolute bottom-4 right-4 bg-black/50 text-white text-xs font-bold px-3 py-1 rounded-full backdrop-blur-sm hidden z-10">
                    1 / 1
                </div>
            </div>

            <!-- Zona de la Info del Modal -->
            <div class="w-full md:w-2/5 p-6 md:p-10 flex flex-col overflow-y-auto">
                <h2 class="text-2xl md:text-4xl font-black text-gray-900 mb-2 tracking-tight" id="modal-title">Nombre</h2>
                <p class="text-xl md:text-3xl font-black text-gray-900 mb-6" id="modal-price">0.00 €</p>
                
                <p class="text-gray-600 text-sm md:text-base mb-8 leading-relaxed font-medium" id="modal-description">Descripción...</p>
                
                <div class="mt-auto">
                    <!-- Colores -->
                    <p class="text-xs md:text-sm text-gray-500 mb-3 uppercase font-bold tracking-wider">Color seleccionado</p>
                    <div class="flex flex-wrap gap-3 mb-6" id="modal-colors-container"></div>

                    <!-- Selector de Tallas -->
                    <p class="text-xs md:text-sm text-gray-500 mb-3 uppercase font-bold tracking-wider">Talla</p>
                    <div class="flex flex-wrap gap-2 mb-6" id="modal-sizes-container"></div>
                    
                    <!-- Selector de cantidad -->
                    <p class="text-xs md:text-sm text-gray-500 mb-2 uppercase font-bold tracking-wider">Cantidad</p>
                    <div class="flex items-center gap-4 mb-6 md:mb-8">
                        <div class="flex items-center border border-gray-300 rounded-xl overflow-hidden bg-white shadow-sm transition-all hover:border-gray-400">
                            <button onclick="changeModalQty(-1)" class="px-4 py-2 md:py-3 text-gray-600 hover:bg-gray-100 font-bold transition focus:outline-none">-</button>
                            <input type="number" id="modal-qty" value="1" min="1" max="500" class="w-16 text-center font-bold focus:outline-none border-x border-gray-300 py-2 md:py-3" onblur="validateModalQty(this)">
                            <button onclick="changeModalQty(1)" class="px-4 py-2 md:py-3 text-gray-600 hover:bg-gray-100 font-bold transition focus:outline-none">+</button>
                        </div>
                        <span class="text-xs text-gray-400 font-medium">Máx: 500</span>
                    </div>

                    <!-- BOTÓN AÑADIR -->
                    <button id="modal-add-to-cart-btn" onclick="addToCart()" class="w-full bg-black text-white py-4 md:py-5 rounded-xl font-bold text-base md:text-lg hover:bg-gray-800 hover:-translate-y-1 transform transition-all duration-300 shadow-xl hover:shadow-2xl focus:outline-none active:scale-[0.98]">
                        Añadir al carrito
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- PANEL DEL CARRITO LATERAL (SLIDE-OVER) -->
    <div id="cart-panel" class="fixed inset-y-0 right-0 z-[60] w-full max-w-md bg-white shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col">
        <!-- Cabecera del carrito -->
        <div class="px-6 py-4 border-b flex justify-between items-center bg-gray-50">
            <h2 class="text-xl font-black text-gray-900 tracking-tight">Tu Carrito</h2>
            <button onclick="toggleCart()" class="p-2 text-gray-500 hover:text-black hover:bg-gray-200 hover:scale-110 rounded-full transition-all duration-300 focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>

        <!-- Lista de items -->
        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4 bg-white"></div>

        <!-- Pie del carrito -->
        <div class="p-6 border-t bg-gray-50 flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <span class="text-gray-600 font-semibold uppercase tracking-wider text-sm">Total:</span>
                <span id="cart-total" class="text-2xl font-black text-gray-900">0.00 €</span>
            </div>

            <!-- Formulario de Checkout -->
            <form id="checkout-form" class="space-y-3 mt-2 hidden">
                <h3 class="font-bold text-gray-800 text-sm mb-2 border-b pb-1 uppercase tracking-wider">Datos de envío</h3>
                <input type="text" id="order-name" required placeholder="Nombre y Apellidos" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-black outline-none transition-all text-sm font-medium hover:border-gray-400">
                <input type="email" id="order-email" required placeholder="Correo Electrónico" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-black outline-none transition-all text-sm font-medium hover:border-gray-400">
                <input type="tel" id="order-phone" required placeholder="Número de Teléfono" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-black outline-none transition-all text-sm font-medium hover:border-gray-400">
                
                <button type="submit" id="btn-submit-order" class="w-full bg-black text-white py-4 rounded-xl font-bold text-lg hover:bg-gray-800 hover:-translate-y-1 transform transition-all duration-300 shadow-lg mt-2 focus:outline-none">
                    Ejecutar orden
                </button>
            </form>
            
            <button id="btn-show-checkout" onclick="showCheckout()" class="w-full bg-black text-white py-4 rounded-xl font-bold text-lg hover:bg-gray-800 hover:-translate-y-1 transform transition-all duration-300 shadow-lg focus:outline-none hidden">
                Tramitar Pedido
            </button>
            
            <div id="checkout-msg" class="text-center font-bold mt-4 p-3 rounded-lg hidden"></div>
        </div>
    </div>
    
    <!-- FONDO OSCURO PARA EL CARRITO -->
    <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/40 z-[55] hidden opacity-0 transition-opacity duration-300 backdrop-blur-sm"></div>

    <!-- Importamos el cliente de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Lógica de la aplicación -->
    <script>
        // ==========================================
        // 1. CONFIGURACIÓN
        // ==========================================
        var supabaseUrl = 'https://koignwzdqxcilwieqijq.supabase.co'; 
        var supabaseAnonKey = 'sb_publishable__bw11mniMfgl_R9JWyL7SA_aPKqltNa';
        var supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        const TELEGRAM_BOT_TOKEN = '8603553045:AAFpmVcNjxbvzsvb09egdVzLxcscAtaRr-Y';
        const TELEGRAM_CHAT_IDS = ['7200570066', '6519651464']; 

        var appProducts = []; 
        var currentModalProduct = null;
        var currentVariantIndex = 0; 
        var currentSelectedSize = null; 
        
        let cart = JSON.parse(localStorage.getItem('nardo_cart')) || [];
        var currentCarouselImages = [];
        var currentCarouselIndex = 0;
        var cartOverlayTimeout; 

        const getPlaceholder = (colorHex) => `<div class="w-full h-full flex items-center justify-center bg-gray-100"><svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="${colorHex}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="drop-shadow-sm opacity-50"><path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg></div>`;

        // REVERTIDO A OBJECT-COVER (Llena el cuadro) MANTENIENDO ANIMACIÓN (scale-110)
        const renderFirstImage = (variant) => {
            if (!variant.image_url) return getPlaceholder(variant.color_hex);
            const firstUrl = variant.image_url.split(',')[0].trim();
            return `<img src="${firstUrl}" alt="Variante" class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-110">`;
        };

        // ==========================================
        // 2. RENDERIZADO DEL ESCAPARATE
        // ==========================================
        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = ''; 

            if (!products || products.length === 0) {
                // Mensaje elegante de que no hay productos o no coincide la búsqueda
                grid.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20 bg-white/5 rounded-3xl backdrop-blur-sm border border-white/10 mt-4">
                        <span class="text-5xl mb-4 opacity-80">🔍</span>
                        <h3 class="text-xl md:text-2xl font-bold text-white mb-2">No hemos encontrado nada</h3>
                        <p class="text-gray-200 text-center px-4 font-medium">Prueba a buscar con otra palabra o revisa si está bien escrita.</p>
                    </div>`;
                return;
            }

            products.forEach(product => {
                if (!product.variants || product.variants.length === 0) return;

                const colorsHTML = product.variants.map((variant, index) => 
                    `<button 
                        onclick="changeCardImage(${product.id}, ${index}, event)" 
                        class="w-5 h-5 md:w-6 md:h-6 rounded-full border-2 border-gray-200 hover:scale-125 transition-transform duration-300 shadow-sm focus:outline-none focus:border-black shrink-0 relative overflow-hidden" 
                        style="background-color: ${variant.color_hex}; ${variant.is_sold_out ? 'opacity: 0.5;' : ''}" 
                        title="${variant.color_name}${variant.is_sold_out ? ' (Agotado)' : ''}">
                        ${variant.is_sold_out ? '<div class="absolute inset-0 m-auto w-full h-[1.5px] bg-red-600 -rotate-45 shadow-sm"></div>' : ''}
                    </button>`
                ).join('');

                const defaultVariant = product.variants[0];

                // ANIMACIONES DE HOVER MANTENIDAS (scale, translate-y, shadow)
                const productCard = `
                    <div class="bg-white rounded-2xl shadow-lg overflow-hidden flex flex-col hover:shadow-2xl hover:scale-[1.03] hover:-translate-y-1.5 transform transition-all duration-300 ease-out cursor-pointer group" onclick="openModal(${product.id})">
                        <div class="aspect-[4/5] bg-gray-50 flex items-center justify-center border-b border-gray-100 relative overflow-hidden" id="card-img-container-${product.id}">
                            ${renderFirstImage(defaultVariant)}
                        </div>
                        <div class="p-4 md:p-5 flex flex-col flex-grow">
                            <div class="flex flex-col md:flex-row justify-between md:items-start mb-2 gap-1 md:gap-2">
                                <h3 class="text-base md:text-lg font-bold text-gray-900 group-hover:text-black transition-colors leading-tight">${product.name}</h3>
                                <p class="text-base md:text-lg font-black text-gray-900 whitespace-nowrap">${product.price}€</p>
                            </div>
                            <div class="mt-auto pt-3 md:pt-4 flex items-center justify-between">
                                <div class="flex gap-1 md:gap-2 overflow-x-auto pb-1 no-scrollbar">
                                    ${colorsHTML}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += productCard;
            });
        }

        // ==========================================
        // NUEVO: LÓGICA DEL BUSCADOR INTELIGENTE
        // ==========================================
        function filterProducts() {
            // Recogemos lo que escribe el usuario, en minúsculas y sin tildes
            const input = document.getElementById('search-input').value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
            
            if (!input) {
                renderProducts(appProducts);
                return;
            }

            // Lógica para plurales sencillos (Si busca "bañadores", buscaremos la base "bañador")
            let stem = input;
            if (input.endsWith('es') && input.length > 3) {
                stem = input.slice(0, -2);
            } else if (input.endsWith('s') && input.length > 2) {
                stem = input.slice(0, -1);
            }

            // Filtramos el array principal
            const filtered = appProducts.filter(p => {
                // Buscamos dentro del título del producto y de su descripción
                const searchArea = (p.name + " " + (p.description || "")).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                return searchArea.includes(input) || searchArea.includes(stem);
            });

            renderProducts(filtered);
        }

        // ==========================================
        // 3. LÓGICA DE INTERACCIÓN, MODAL Y CARRUSEL
        // ==========================================
        function changeCardImage(productId, variantIndex, event) {
            if(event) event.stopPropagation(); 
            const product = appProducts.find(p => p.id === productId);
            const container = document.getElementById(`card-img-container-${productId}`);
            if (product && container) container.innerHTML = renderFirstImage(product.variants[variantIndex]);
        }

        function renderCarouselImage() {
            const container = document.getElementById('modal-image-container');
            const arrows = document.getElementById('carousel-arrows');
            const indicator = document.getElementById('carousel-indicator');

            if (currentCarouselImages.length === 0) {
                container.innerHTML = getPlaceholder(currentModalProduct.variants[0]?.color_hex || '#000');
                arrows.classList.add('hidden');
                indicator.classList.add('hidden');
                return;
            }

            const imgUrl = currentCarouselImages[currentCarouselIndex];
            // REVERTIDO A OBJECT-COVER/CONTAIN SIN PADDINGS PARA VERSE MÁS GRANDE
            container.innerHTML = `<img src="${imgUrl}" alt="Vista producto" class="w-full h-full object-cover md:object-contain absolute inset-0 transition-opacity duration-300">`;

            if (currentCarouselImages.length > 1) {
                arrows.classList.remove('hidden');
                indicator.classList.remove('hidden');
                indicator.innerText = `${currentCarouselIndex + 1} / ${currentCarouselImages.length}`;
            } else {
                arrows.classList.add('hidden');
                indicator.classList.add('hidden');
            }
        }

        function nextImage(e) {
            if(e) e.stopPropagation();
            if (currentCarouselImages.length <= 1) return;
            currentCarouselIndex = (currentCarouselIndex + 1) % currentCarouselImages.length;
            renderCarouselImage();
        }

        function prevImage(e) {
            if(e) e.stopPropagation();
            if (currentCarouselImages.length <= 1) return;
            currentCarouselIndex = (currentCarouselIndex - 1 + currentCarouselImages.length) % currentCarouselImages.length;
            renderCarouselImage();
        }

        function changeModalImage(variantIndex) {
            if (!currentModalProduct) return;
            
            currentVariantIndex = variantIndex; 
            const variant = currentModalProduct.variants[variantIndex];
            
            if (variant.image_url) {
                currentCarouselImages = variant.image_url.split(',').map(url => url.trim()).filter(url => url !== "");
            } else {
                currentCarouselImages = [];
            }
            
            currentCarouselIndex = 0;
            renderCarouselImage();
            
            const buttons = document.querySelectorAll('.modal-color-btn');
            buttons.forEach((btn, idx) => {
                if (idx === variantIndex) btn.classList.add('ring-2', 'ring-offset-2', 'ring-black', 'scale-110');
                else btn.classList.remove('ring-2', 'ring-offset-2', 'ring-black', 'scale-110');
            });

            const sizes = variant.available_sizes ? variant.available_sizes.split(',').map(s => s.trim()).filter(s => s !== '') : [];
            const sizesContainer = document.getElementById('modal-sizes-container');
            
            if (sizes.length === 0) {
                sizesContainer.innerHTML = '<span class="text-sm text-gray-500 italic">No hay tallas configuradas</span>';
                currentSelectedSize = null;
            } else {
                currentSelectedSize = sizes[0]; 
                sizesContainer.innerHTML = sizes.map(sz => `
                    <button onclick="selectSize('${sz}')" class="modal-size-btn border-2 ${sz === currentSelectedSize ? 'border-black text-black scale-105' : 'border-gray-200 text-gray-500 hover:border-gray-400 hover:scale-105'} font-bold py-1.5 px-3 md:py-2 md:px-4 rounded-lg transition-all duration-200 focus:outline-none">
                        ${sz}
                    </button>
                `).join('');
            }

            const cartBtn = document.getElementById('modal-add-to-cart-btn');
            if (variant.is_sold_out) {
                cartBtn.disabled = true;
                cartBtn.innerText = 'Color Agotado';
                cartBtn.classList.remove('bg-black', 'hover:bg-gray-800', 'active:scale-[0.98]', 'hover:-translate-y-1');
                cartBtn.classList.add('bg-gray-400', 'cursor-not-allowed');
            } else if (sizes.length === 0) {
                cartBtn.disabled = true;
                cartBtn.innerText = 'Sin tallas disponibles';
                cartBtn.classList.remove('bg-black', 'hover:bg-gray-800', 'active:scale-[0.98]', 'hover:-translate-y-1');
                cartBtn.classList.add('bg-gray-400', 'cursor-not-allowed');
            } else {
                cartBtn.disabled = false;
                cartBtn.innerText = 'Añadir al carrito';
                cartBtn.classList.add('bg-black', 'hover:bg-gray-800', 'active:scale-[0.98]', 'hover:-translate-y-1');
                cartBtn.classList.remove('bg-gray-400', 'cursor-not-allowed');
            }
        }

        window.selectSize = function(sz) {
            currentSelectedSize = sz;
            const btns = document.querySelectorAll('.modal-size-btn');
            btns.forEach(btn => {
                if (btn.innerText.trim() === sz) {
                    btn.classList.add('border-black', 'text-black', 'scale-105');
                    btn.classList.remove('border-gray-200', 'text-gray-500', 'hover:border-gray-400', 'hover:scale-105');
                } else {
                    btn.classList.remove('border-black', 'text-black', 'scale-105');
                    btn.classList.add('border-gray-200', 'text-gray-500', 'hover:border-gray-400', 'hover:scale-105');
                }
            });
        };

        function openModal(productId) {
            const product = appProducts.find(p => p.id === productId);
            if (!product) return;
            
            currentModalProduct = product;
            document.getElementById('modal-title').innerText = product.name;
            document.getElementById('modal-price').innerText = `${product.price} €`;
            document.getElementById('modal-description').innerText = product.description || 'Sin descripción';
            
            const colorsHTML = product.variants.map((variant, index) => 
                `<button 
                    onclick="changeModalImage(${index})" 
                    class="modal-color-btn w-8 h-8 md:w-10 md:h-10 rounded-full border border-gray-200 hover:scale-110 transition-all duration-300 shadow-sm focus:outline-none shrink-0 relative overflow-hidden" 
                    style="background-color: ${variant.color_hex}; ${variant.is_sold_out ? 'opacity: 0.5;' : ''}" 
                    title="${variant.color_name}${variant.is_sold_out ? ' (Agotado)' : ''}">
                    ${variant.is_sold_out ? '<div class="absolute inset-0 m-auto w-full h-[2px] bg-red-600 -rotate-45 shadow-sm"></div>' : ''}
                </button>`
            ).join('');
            document.getElementById('modal-colors-container').innerHTML = colorsHTML;

            const modal = document.getElementById('product-modal');
            const modalContent = document.getElementById('modal-content');
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('translate-y-full', 'md:scale-95');
            }, 10);
            
            document.getElementById('modal-qty').value = 1; 
            changeModalImage(0);
        }

        function closeModal() {
            const modal = document.getElementById('product-modal');
            const modalContent = document.getElementById('modal-content');
            
            modal.classList.add('opacity-0');
            modalContent.classList.add('translate-y-full', 'md:scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                currentModalProduct = null;
            }, 300);
        }

        document.getElementById('product-modal').addEventListener('click', function(event) {
            if (event.target === this) closeModal();
        });

        // ==========================================
        // 4. LÓGICA DEL CARRITO Y PEDIDOS
        // ==========================================
        
        function changeModalQty(change) {
            const qtyInput = document.getElementById('modal-qty');
            let current = parseInt(qtyInput.value);
            if(isNaN(current)) current = 1;
            let newVal = current + change;
            if (newVal < 1) newVal = 1;
            if (newVal > 500) newVal = 500; 
            qtyInput.value = newVal;
        }

        function validateModalQty(input) {
            let val = parseInt(input.value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > 500) val = 500;
            input.value = val;
        }

        function addToCart() {
            if (!currentModalProduct) return;
            validateModalQty(document.getElementById('modal-qty'));
            
            const variant = currentModalProduct.variants[currentVariantIndex];

            if (variant.is_sold_out) return; 

            if (!currentSelectedSize && variant.available_sizes) {
                alert('Por favor, selecciona una talla antes de añadir al carrito.');
                return;
            }

            const qty = parseInt(document.getElementById('modal-qty').value);
            
            const existingItemIndex = cart.findIndex(item => 
                item.productId === currentModalProduct.id && 
                item.variantIndex === currentVariantIndex && 
                item.size === currentSelectedSize
            );
            
            if (existingItemIndex > -1) {
                cart[existingItemIndex].quantity += qty;
                if(cart[existingItemIndex].quantity > 500) cart[existingItemIndex].quantity = 500;
            } else {
                const cartImage = variant.image_url ? variant.image_url.split(',')[0].trim() : null;
                cart.push({
                    productId: currentModalProduct.id,
                    variantIndex: currentVariantIndex,
                    name: currentModalProduct.name,
                    price: currentModalProduct.price,
                    colorName: variant.color_name,
                    colorHex: variant.color_hex,
                    size: currentSelectedSize, 
                    imageUrl: cartImage,
                    quantity: qty
                });
            }
            
            saveCart();
            updateCartUI();
            closeModal();
            toggleCart(); 
        }

        function saveCart() {
            localStorage.setItem('nardo_cart', JSON.stringify(cart));
            updateCartBadge();
        }

        function updateCartBadge() {
            const badge = document.getElementById('cart-badge');
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            
            if (totalItems > 0) {
                badge.innerText = totalItems > 99 ? '99+' : totalItems;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function toggleCart() {
            const panel = document.getElementById('cart-panel');
            const overlay = document.getElementById('cart-overlay');
            const isClosed = panel.classList.contains('translate-x-full');
            
            clearTimeout(cartOverlayTimeout); 
            
            if (isClosed) {
                updateCartUI(); 
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
                panel.classList.remove('translate-x-full');
                
                document.getElementById('checkout-form').classList.add('hidden');
                document.getElementById('checkout-msg').classList.add('hidden');
            } else {
                panel.classList.add('translate-x-full');
                overlay.classList.add('opacity-0');
                cartOverlayTimeout = setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCart();
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            const btnShowCheckout = document.getElementById('btn-show-checkout');
            const formCheckout = document.getElementById('checkout-form');
            
            container.innerHTML = '';
            let total = 0;
            
            if (cart.length === 0) {
                container.innerHTML = '<div class="h-full flex items-center justify-center text-gray-400 font-medium">Tu carrito está vacío</div>';
                btnShowCheckout.classList.add('hidden');
                formCheckout.classList.add('hidden');
            } else {
                cart.forEach((item, index) => {
                    total += item.price * item.quantity;
                    
                    const imgHtml = item.imageUrl 
                        ? `<img src="${item.imageUrl}" class="w-16 h-16 object-cover rounded-md border border-gray-200">`
                        : `<div class="w-16 h-16 rounded-md border border-gray-200 bg-gray-50 flex items-center justify-center"><div class="w-6 h-6 rounded-full" style="background-color: ${item.colorHex}"></div></div>`;

                    const itemSizeText = item.size ? ` - Talla ${item.size}` : '';

                    container.innerHTML += `
                        <div class="flex gap-4 items-center bg-white p-3 rounded-xl border border-gray-100 shadow-sm hover:shadow-md hover:scale-[1.01] transition-all duration-300">
                            ${imgHtml}
                            <div class="flex-1">
                                <h4 class="font-bold text-gray-900 text-sm">${item.name}${itemSizeText}</h4>
                                <div class="flex items-center gap-2 mt-1">
                                    <div class="w-3 h-3 rounded-full border border-gray-300" style="background-color: ${item.colorHex}"></div>
                                    <span class="text-xs text-gray-500">${item.colorName}</span>
                                </div>
                                <div class="flex justify-between items-center mt-2">
                                    <span class="font-black text-gray-900">${item.price} € x ${item.quantity}</span>
                                </div>
                            </div>
                            <button onclick="removeFromCart(${index})" class="text-gray-400 hover:text-red-500 hover:scale-110 transition-all duration-300 focus:outline-none p-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>
                    `;
                });
                
                if(formCheckout.classList.contains('hidden')) {
                    btnShowCheckout.classList.remove('hidden');
                }
            }
            
            totalEl.innerText = total.toFixed(2) + ' €';
        }

        function showCheckout() {
            document.getElementById('btn-show-checkout').classList.add('hidden');
            document.getElementById('checkout-form').classList.remove('hidden');
        }

        // ==========================================
        // 5. EJECUTAR ORDEN (Supabase + Telegram)
        // ==========================================
        document.getElementById('checkout-form').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            if (cart.length === 0) return;

            const btn = document.getElementById('btn-submit-order');
            const msg = document.getElementById('checkout-msg');
            const name = document.getElementById('order-name').value;
            const email = document.getElementById('order-email').value;
            const phone = document.getElementById('order-phone').value;
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            btn.disabled = true;
            btn.innerText = "Procesando...";
            msg.classList.add('hidden');

            try {
                const { error: supabaseError } = await supabase.from('orders').insert([{
                    customer_name: name,
                    customer_email: email,
                    customer_phone: phone,
                    items: cart,
                    total_price: total
                }]);

                if (supabaseError) throw supabaseError;

                if (TELEGRAM_CHAT_IDS.length === 0) {
                    console.warn("Faltan los Chat IDs de Telegram.");
                } else {
                    const telegramText = `🔥 ¡NUEVO PEDIDO! 🔥\n\n👤 Nombre: ${name}\n📧 Email: ${email}\n📞 Teléfono: ${phone}\n💰 Total: ${total.toFixed(2)} €\n\n📦 PRODUCTOS:\n${cart.map(item => {
                        const itemSizeText = item.size ? ` - Talla ${item.size}` : '';
                        return `- ${item.quantity}x ${item.name}${itemSizeText} (${item.colorName})`;
                    }).join('\n')}`;
                    
                    await Promise.all(TELEGRAM_CHAT_IDS.map(chatId => 
                        fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                chat_id: chatId,
                                text: telegramText
                            })
                        })
                    ));
                }

                cart = [];
                saveCart();
                document.getElementById('checkout-form').reset();
                
                msg.innerText = "¡Pedido realizado con éxito! Nos pondremos en contacto contigo.";
                msg.className = "text-center font-bold mt-4 p-3 rounded-lg bg-green-100 text-green-800 block";
                btn.classList.add('hidden'); 
                
                setTimeout(() => {
                    toggleCart(); 
                }, 3000);

            } catch (err) {
                console.error("Error al procesar el pedido:", err);
                msg.innerText = "Error al procesar el pedido. Inténtalo de nuevo.";
                msg.className = "text-center font-bold mt-4 p-3 rounded-lg bg-red-100 text-red-800 block";
                btn.disabled = false;
                btn.innerText = "Ejecutar orden";
            }
        });

        // ==========================================
        // 6. CONEXIÓN A SUPABASE Y DATOS 
        // ==========================================
        async function fetchAndLoadProducts() {
            try {
                const { data, error } = await supabase
                    .from('products')
                    .select('*, variants:product_variants(*)')
                    .eq('is_visible', true);

                if (error) throw error;

                appProducts = data;
                // Si había una búsqueda activa, la aplicamos. Si no, renderiza normal.
                const searchVal = document.getElementById('search-input').value;
                if(searchVal) {
                    filterProducts();
                } else {
                    renderProducts(appProducts);
                }
                
                if (currentModalProduct) {
                    changeModalImage(currentVariantIndex);
                }
            } catch (error) {
                console.error("Error al cargar desde Supabase:", error);
            }
        }

        // ==========================================
        // 7. SUPABASE REALTIME
        // ==========================================
        function setupRealtime() {
            supabase
                .channel('public:products')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, payload => {
                    console.log('¡Cambio detectado en BD!', payload);
                    fetchAndLoadProducts();
                    
                    if (currentModalProduct) {
                        if (payload.eventType === 'UPDATE' && payload.new.is_visible === false && payload.new.id === currentModalProduct.id) {
                            closeModal();
                        }
                        if (payload.eventType === 'DELETE' && payload.old.id === currentModalProduct.id) {
                            closeModal();
                        }
                    }
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'product_variants' }, payload => {
                    fetchAndLoadProducts(); 
                })
                .subscribe();
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchAndLoadProducts(); 
            setupRealtime();        
            updateCartBadge(); 
        });

    </script>

    <!-- ========================================== -->
    <!-- SISTEMA DE TRADUCCIÓN AUTOMÁTICA INVISIBLE -->
    <!-- ========================================== -->
    <div id="google_translate_element"></div>
    
    <style>
        /* Ocultamos todo el rastro visual de Google para no romper tu diseño */
        .goog-te-banner-frame.skiptranslate { display: none !important; }
        body { top: 0px !important; }
        #goog-gt-tt { display: none !important; } /* Oculta el tooltip al pasar el ratón */
        #google_translate_element { display: none !important; }
        
        /* Mantenemos tus estilos de scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script type="text/javascript">
        // 1. Detectamos el idioma del navegador del usuario (ej: 'en', 'sv', 'fr')
        var userLang = (navigator.language || navigator.userLanguage).split('-')[0];
        
        // 2. Si su idioma NO es el español y es la primera vez que entra, le forzamos la traducción
        if (userLang !== 'es' && document.cookie.indexOf('googtrans') === -1) {
            // Creamos la cookie que Google lee para traducir automáticamente
            document.cookie = "googtrans=/es/" + userLang + "; path=/";
            document.cookie = "googtrans=/es/" + userLang + "; domain=" + window.location.hostname + "; path=/";
        }

        // 3. Inicializamos el traductor de Google de forma silenciosa
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'es', 
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
